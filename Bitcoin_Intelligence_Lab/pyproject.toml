[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-intelligence-lab"
version = "0.1.0"
description = "Bitcoin multi-domain market intelligence and risk analysis"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.43,<2"]
market-data = ["websockets>=14,<16"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bitcoinlab*"]
