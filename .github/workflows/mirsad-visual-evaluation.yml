name: Mirsad Visual Engine Evaluation

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  visual-structure-regression:
    name: Visual structure and event-study regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Mirsad_BTC
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test structure geometry detectors
        run: |
          python -m unittest discover -s tests -p "test_chart_classical_patterns.py" -v
          python -m unittest discover -s tests -p "test_chart_continuation_patterns.py" -v
          python -m unittest discover -s tests -p "test_chart_structure_knowledge.py" -v

      - name: Test visual knowledge archive
        run: python -m unittest discover -s tests -p "test_visual_knowledge.py" -v

      - name: Test historical structure event study
        run: python -m unittest discover -s tests -p "test_chart_structure_evaluation.py" -v

      - name: Test reproducible study command
        run: python -m unittest discover -s tests -p "test_run_structure_study.py" -v

      - name: Install image-analysis dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=2.0,<3" "opencv-python-headless>=4.10,<5" "Pillow>=10,<13" "rapidocr>=3.10,<4" "onnxruntime>=1.20,<2" "TA-Lib==0.8.3"


      - name: Test image candle extraction
        run: python -m unittest discover -s tests -p "test_chart_extraction.py" -v

      - name: Test price-axis and header OCR
        run: |
          python -m unittest discover -s tests -p "test_chart_ocr.py" -v
          python -m unittest discover -s tests -p "test_chart_header_ocr.py" -v

      - name: Test scale-free pixel visual evidence
        run: python -m unittest discover -s tests -p "test_chart_pixel_metrics.py" -v

      - name: Test calibrated chart image engine
        run: python -m unittest discover -s tests -p "test_chart_engine.py" -v

      - name: Test multi-timeframe visual structure
        run: python -m unittest discover -s tests -p "test_chart_multi_timeframe.py" -v

      - name: Test public image benchmark helpers
        run: python -m unittest discover -s tests -p "test_public_chart_image_benchmark.py" -v

      - name: Run Engine 2 on public BTC chart images
        run: python scripts/run_public_chart_image_benchmark.py --output reports/public_chart_image_benchmark.json

      - name: Upload public chart benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: mirsad-public-chart-image-benchmark-${{ github.run_id }}
          path: Mirsad_BTC/reports/public_chart_image_benchmark.json
          if-no-files-found: error
          retention-days: 30

  btc-huggingface-large-image-benchmark:
    if: github.event_name == 'workflow_dispatch'
    name: BTC Hugging Face chart image benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Mirsad_BTC
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=2.0,<3" "opencv-python-headless>=4.10,<5" "Pillow>=10,<13" "rapidocr>=3.10,<4" "onnxruntime>=1.20,<2" "TA-Lib==0.8.3" "datasets>=3,<5"

      - name: Test HF benchmark helpers
        run: python -m unittest discover -s tests -p "test_hf_btc_chart_image_benchmark.py" -v

      - name: Run Engine 2 on more than 10,000 BTC chart images
        run: python scripts/run_hf_btc_chart_image_benchmark.py --max-images 13081 --min-images 10000 --ocr-sample-limit 128 --output reports/hf_btc_chart_image_benchmark.json

      - name: Upload BTC chart image benchmark
        uses: actions/upload-artifact@v4
        with:
          name: mirsad-hf-btc-chart-image-benchmark-${{ github.run_id }}
          path: Mirsad_BTC/reports/hf_btc_chart_image_benchmark.json
          if-no-files-found: error
          retention-days: 30
