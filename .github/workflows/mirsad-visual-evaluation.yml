  push:
    branches:
      - mirsad-mt5-demo
    paths:
      - "Mirsad_BTC/mirsad/engines/chart_structure_evaluation.py"
      - "Mirsad_BTC/mirsad/engines/chart_structure_knowledge.py"
      - "Mirsad_BTC/mirsad/engines/chart_classical_patterns.py"
      - "Mirsad_BTC/mirsad/engines/chart_continuation_patterns.py"
      - "Mirsad_BTC/mirsad/engines/visual_knowledge.py"
      - "Mirsad_BTC/mirsad/storage.py"
      - "Mirsad_BTC/tests/test_chart_structure_evaluation.py"
      - "Mirsad_BTC/scripts/run_structure_study.py"
      - "Mirsad_BTC/tests/test_run_structure_study.py"
      - "Mirsad_BTC/tests/test_chart_classical_patterns.py"
      - "Mirsad_BTC/tests/test_chart_continuation_patterns.py"
      - "Mirsad_BTC/tests/test_chart_structure_knowledge.py"
      - "Mirsad_BTC/tests/test_visual_knowledge.py"
      - "Mirsad_BTC/mirsad/engines/chart.py"
      - "Mirsad_BTC/mirsad/engines/chart_calibration.py"
      - "Mirsad_BTC/mirsad/engines/chart_extraction.py"
      - "Mirsad_BTC/mirsad/engines/chart_image.py"
      - "Mirsad_BTC/mirsad/engines/chart_metrics.py"
      - "Mirsad_BTC/mirsad/engines/chart_ocr.py"
      - "Mirsad_BTC/mirsad/engines/chart_pattern_reference.py"
      - "Mirsad_BTC/mirsad/engines/chart_pattern_knowledge.py"
      - "Mirsad_BTC/mirsad/engines/chart_structure_knowledge.py"
      - "Mirsad_BTC/tests/test_chart_engine.py"
      - "Mirsad_BTC/tests/test_chart_extraction.py"
      - "Mirsad_BTC/tests/test_chart_ocr.py"
      - "Mirsad_BTC/tests/test_chart_header_ocr.py"
      - "Mirsad_BTC/tests/test_chart_multi_timeframe.py"
      - "Mirsad_BTC/tests/test_public_chart_image_benchmark.py"
      - "Mirsad_BTC/scripts/run_public_chart_image_benchmark.py"
      - "Mirsad_BTC/tests/data/public_chart_manifest.json"
      - ".github/workflows/mirsad-visual-evaluation.yml"
  pull_request:
    branches:
      - mirsad-mt5-demo
    paths:
      - "Mirsad_BTC/mirsad/engines/chart_structure_evaluation.py"
      - "Mirsad_BTC/mirsad/engines/chart_structure_knowledge.py"
      - "Mirsad_BTC/mirsad/engines/chart_classical_patterns.py"
      - "Mirsad_BTC/mirsad/engines/chart_continuation_patterns.py"
      - "Mirsad_BTC/mirsad/engines/visual_knowledge.py"
      - "Mirsad_BTC/mirsad/storage.py"
      - "Mirsad_BTC/tests/test_chart_structure_evaluation.py"
      - "Mirsad_BTC/scripts/run_structure_study.py"
      - "Mirsad_BTC/tests/test_run_structure_study.py"
      - "Mirsad_BTC/tests/test_chart_classical_patterns.py"
      - "Mirsad_BTC/tests/test_chart_continuation_patterns.py"
      - "Mirsad_BTC/tests/test_chart_structure_knowledge.py"
      - "Mirsad_BTC/tests/test_visual_knowledge.py"
      - "Mirsad_BTC/mirsad/engines/chart.py"
      - "Mirsad_BTC/mirsad/engines/chart_calibration.py"
      - "Mirsad_BTC/mirsad/engines/chart_extraction.py"
      - "Mirsad_BTC/mirsad/engines/chart_image.py"
      - "Mirsad_BTC/mirsad/engines/chart_metrics.py"
      - "Mirsad_BTC/mirsad/engines/chart_ocr.py"
      - "Mirsad_BTC/mirsad/engines/chart_pattern_reference.py"
      - "Mirsad_BTC/mirsad/engines/chart_pattern_knowledge.py"
      - "Mirsad_BTC/mirsad/engines/chart_structure_knowledge.py"
      - "Mirsad_BTC/tests/test_chart_engine.py"
      - "Mirsad_BTC/tests/test_chart_extraction.py"
      - "Mirsad_BTC/tests/test_chart_ocr.py"
      - "Mirsad_BTC/tests/test_chart_header_ocr.py"
      - "Mirsad_BTC/tests/test_chart_multi_timeframe.py"
      - "Mirsad_BTC/tests/test_public_chart_image_benchmark.py"
      - "Mirsad_BTC/scripts/run_public_chart_image_benchmark.py"
      - "Mirsad_BTC/tests/data/public_chart_manifest.json"
      - ".github/workflows/mirsad-visual-evaluation.yml"

concurrency:
  group: mirsad-visual-evaluation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-structure-regression:
    name: Visual structure and event-study regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Mirsad_BTC
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test structure geometry detectors
        run: |
          python -m unittest discover -s tests -p "test_chart_classical_patterns.py" -v
          python -m unittest discover -s tests -p "test_chart_continuation_patterns.py" -v
          python -m unittest discover -s tests -p "test_chart_structure_knowledge.py" -v

      - name: Test visual knowledge archive
        run: python -m unittest discover -s tests -p "test_visual_knowledge.py" -v

      - name: Test historical structure event study
        run: python -m unittest discover -s tests -p "test_chart_structure_evaluation.py" -v

      - name: Test reproducible study command
        run: python -m unittest discover -s tests -p "test_run_structure_study.py" -v

      - name: Install image-analysis dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=2.0,<3" "opencv-python-headless>=4.10,<5" "Pillow>=10,<13" "rapidocr>=3.10,<4" "onnxruntime>=1.20,<2" "TA-Lib==0.8.3"


      - name: Test image candle extraction
        run: python -m unittest discover -s tests -p "test_chart_extraction.py" -v

      - name: Test price-axis and header OCR
        run: |
          python -m unittest discover -s tests -p "test_chart_ocr.py" -v
          python -m unittest discover -s tests -p "test_chart_header_ocr.py" -v

      - name: Test calibrated chart image engine
        run: python -m unittest discover -s tests -p "test_chart_engine.py" -v

      - name: Test multi-timeframe visual structure
        run: python -m unittest discover -s tests -p "test_chart_multi_timeframe.py" -v

      - name: Test public image benchmark helpers
        run: python -m unittest discover -s tests -p "test_public_chart_image_benchmark.py" -v

      - name: Run Engine 2 on public BTC chart images
        run: python scripts/run_public_chart_image_benchmark.py --output reports/public_chart_image_benchmark.json
