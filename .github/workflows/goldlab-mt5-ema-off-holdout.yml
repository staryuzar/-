name: GoldLab MT5 Model 4 EMA20 OFF August Matched Control

on:
  push:
    branches: [gold-xauusd-expert-lab]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/scripts/goldlab_adx25_ema20_off_holdout.ps1"
      - ".github/workflows/goldlab-mt5-ema-off-holdout.yml"
  pull_request:
    branches: [main]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/scripts/goldlab_adx25_ema20_off_holdout.ps1"
      - ".github/workflows/goldlab-mt5-ema-off-holdout.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldlab-mt5-ema-off-holdout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matched-august-control:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
    steps:
      - name: Checkout research branch for matched August control
        uses: actions/checkout@v4

      - name: Run Model=4 August EMA20-off control with strict real-tick coverage gate
        shell: pwsh
        run: |
          .github/scripts/goldlab_adx25_ema20_off_holdout.ps1

      - name: Upload August matched-control evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldlab-mt5-adx25-ema20-off-august-control-${{ github.run_id }}
          path: goldlab-results/
          if-no-files-found: warn
          retention-days: 90
