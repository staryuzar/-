name: GoldLab Forced INVALID_STOPS Retry Path — v1.017
# Dedicated tester-only fault-injection run; never a strategy performance benchmark.

on:
  push:
    branches: [goldlab-sltp-retry-forced-test]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_sltp_race_diagnostic.ps1"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/scripts/goldlab_retry_math_selftest.py"
      - ".github/workflows/goldlab-sltp-retry-forced-test.yml"

permissions:
  contents: read

concurrency:
  group: goldlab-shared-headway-mt5
  cancel-in-progress: true

jobs:
  math-and-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated fault-injection branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate retry mathematics and test-only guard
        run: python .github/scripts/goldlab_retry_math_selftest.py

  mt5-forced-invalid-stops:
    needs: math-and-source-contract
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
    steps:
      - name: Checkout isolated fault-injection branch
        uses: actions/checkout@v4
      - name: Parse wrapper and assert isolated fault-injection controls
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = ".github/scripts/goldlab_sltp_race_diagnostic.ps1"
          $source = Get-Content -LiteralPath "trading-lab/gold-xauusd/GoldLabEA.mq5" -Raw
          $wrapper = Get-Content -LiteralPath $file -Raw
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "PowerShell wrapper parse failed before MT5 launch." }
          if ($source -notmatch '(?m)^#property version\s+"1\.017"' -or
              $source -notmatch 'if\(InpTestForceInvalidStopsOnce && !testerMode\)' -or
              $source -notmatch 'outcome=confirmed;request_id=' -or
              -not $wrapper.Contains("ForceInvalidStopsOnce") -or
              -not $wrapper.Contains("RetryBufferATR") -or
              -not $wrapper.Contains("Forced INVALID_STOPS test requires exactly one confirmed injected trigger")) {
            throw "Forced invalid-stop test is missing the tester-only guard, event correlation, or terminal-outcome assertion."
          }
          $checkIndex = $source.IndexOf('PreflightTradeRequest(request,"open")')
          $injectIndex = $source.IndexOf('request.sl=request.price;')
          $sendIndex = $source.IndexOf('bool sent=OrderSend(request,result);')
          if ($checkIndex -lt 0 -or $injectIndex -le $checkIndex -or $sendIndex -le $injectIndex) {
            throw "Invalid-stop injection is not strictly between initial OrderCheck and OrderSend."
          }
          Write-Host "Forced-path guards PASS; this test mode is off by default and blocked outside Strategy Tester."
      - name: Compile and exercise one forced INVALID_STOPS retry path in MT5
        shell: pwsh
        run: .github/scripts/goldlab_sltp_race_diagnostic.ps1 -ForceInvalidStopsOnce -RetryBufferATR 0.25
      - name: Upload MT5 report, CSV, journals, and reconciled summary even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldlab-forced-invalid-stops-${{ github.run_id }}
          path: |
            goldlab-results/
            goldlab-ordercheck-preflight.txt
          if-no-files-found: warn
          retention-days: 90
