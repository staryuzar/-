name: GoldLab ADX 24–25 — Minimum Threshold Experiment

on:
  push:
    branches: [goldlab-adxmin24-experiment]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_adxmin24_experiment.ps1"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/workflows/goldlab-adxmin24-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldlab-adxmin24-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  adxmin24-experiment:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
    steps:
      - name: Checkout isolated ADX minimum 24 experiment
        uses: actions/checkout@v4

      - name: Compile and run MT5 real-tick diagnostic
        shell: pwsh
        run: .github/scripts/goldlab_adxmin24_experiment.ps1

      - name: Upload report, logs, and deal audit even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldlab-adxmin24-${{ github.run_id }}
          path: |
            goldlab-results/
            goldlab-ordercheck-preflight.txt
          if-no-files-found: warn
          retention-days: 90
