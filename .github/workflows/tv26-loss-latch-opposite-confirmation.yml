name: TV26 loss re-entry latch — opposite confirmation A/B

on:
  push:
    branches:
      - tv26-loss-latch-opposite-confirmation-study
    paths:
      - ".github/workflows/tv26-loss-latch-opposite-confirmation.yml"
      - ".github/scripts/tv26_strategy_cooldown_backtest.ps1"
      - "trading-lab/tv26/TV26_FiveTF_Arabic_CANDIDATE.mq5"
      - "trading-lab/tv26/tests/test_loss_latch_opposite_confirm.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv26-loss-latch-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-tests:
    name: Python contracts and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formula-audit dependencies
        run: python -m pip install -r trading-lab/tv26/requirements-formula-audit.txt
      - name: Run all TV26 regression contracts
        run: python -m unittest discover -s trading-lab/tv26/tests -p "test_*.py"

  tester:
    name: "${{ matrix.window }} — opposite-after-loss latch=${{ matrix.opposite_gate }}"
    needs: contract-tests
    runs-on: windows-2022
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - window: "Oct 20–22"
            from: "2026.10.20"
            to: "2026.10.23"
            opposite_gate: "false"
          - window: "Oct 20–22"
            from: "2026.10.20"
            to: "2026.10.23"
            opposite_gate: "true"
          - window: "Sep 01–10"
            from: "2026.09.01"
            to: "2026.09.11"
            opposite_gate: "false"
          - window: "Sep 01–10"
            from: "2026.09.01"
            to: "2026.09.11"
            opposite_gate: "true"
          - window: "Sep 11–20"
            from: "2026.09.11"
            to: "2026.09.21"
            opposite_gate: "false"
          - window: "Sep 11–20"
            from: "2026.09.11"
            to: "2026.09.21"
            opposite_gate: "true"
          - window: "Oct 01–10"
            from: "2026.10.01"
            to: "2026.10.11"
            opposite_gate: "false"
          - window: "Oct 01–10"
            from: "2026.10.01"
            to: "2026.10.11"
            opposite_gate: "true"
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      TV26_TEST_FROM: "${{ matrix.from }}"
      TV26_TEST_TO: "${{ matrix.to }}"
      TV26_TEST_MODEL: "4"
      TV26_TEST_RISK_PERCENT: "1.00"
      TV26_TEST_STOP_ATR: "2.00"
      TV26_TEST_TARGET_ATR: "4.00"
      TV26_TEST_REQUIRE_M1_BREAKOUT: "true"
      TV26_TEST_COOLDOWN_BARS: "0"
      TV26_TEST_REQUIRE_OPPOSITE_AFTER_LOSS: "${{ matrix.opposite_gate }}"

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formula-audit dependencies
        run: python -m pip install -r trading-lab/tv26/requirements-formula-audit.txt

      - name: Run isolated MT5 real-tick tester, allow one bounded history retry
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $originalSecret = [string]$env:MT5_CREDENTIALS
          if ([string]::IsNullOrWhiteSpace($originalSecret)) { throw "GitHub Actions secret mt5 is missing; no tester run attempted." }
          $scriptPath = ".\.github\scripts\tv26_strategy_cooldown_backtest.ps1"
          $results = Join-Path $PWD "tv26-strategy-results"
          $completed = $false
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            $env:MT5_CREDENTIALS = $originalSecret
            try {
              & $scriptPath
              $completed = $true
              break
            } catch {
              $diagDir = Join-Path $results "diagnostics"
              $transientTickFailure = $false
              if (Test-Path -LiteralPath $diagDir) {
                foreach ($logFile in @(Get-ChildItem -LiteralPath $diagDir -Filter "*.txt" -File -Recurse -ErrorAction SilentlyContinue)) {
                  $logText = Get-Content -LiteralPath $logFile.FullName -Raw -ErrorAction SilentlyContinue
                  if ($logText -match "(?i)no history data, stop testing|preliminary downloading of history ticks canceled") {
                    $transientTickFailure = $true
                    break
                  }
                }
              }
              if ($attempt -ge 2 -or !$transientTickFailure) { throw }
              $failedDiag = Join-Path $results "retry-attempt-1-diagnostics"
              if (Test-Path -LiteralPath $failedDiag) { Remove-Item -LiteralPath $failedDiag -Recurse -Force }
              if (Test-Path -LiteralPath $diagDir) { Move-Item -LiteralPath $diagDir -Destination $failedDiag -Force }
              foreach ($fileName in @(
                "TV26_Audit_XAUUSD_26102327.csv",
                "TV26_OHLC_History_XAUUSD.csv",
                "strategy-tester-report.html",
                "data-integrity-report.md",
                "data-integrity-report.json",
                "formula-parity-report.md",
                "formula-parity-report.json",
                "formula-parity-details.csv"
              )) {
                $filePath = Join-Path $results $fileName
                if (Test-Path -LiteralPath $filePath) { Remove-Item -LiteralPath $filePath -Force }
              }
              $eventLogs = Join-Path $results "diagnostic-logs"
              if (Test-Path -LiteralPath $eventLogs) { Remove-Item -LiteralPath $eventLogs -Recurse -Force }
              Start-Sleep -Seconds 3
            }
          }
          $env:MT5_CREDENTIALS = $null
          if (!$completed) { throw "MT5 Strategy Tester did not complete after the permitted history retry." }
          if (!(Test-Path -LiteralPath (Join-Path $results "strategy-backtest-summary.txt"))) { throw "Tester summary missing." }

      - name: Validate OHLC integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python trading-lab/tv26/validate_tv26_mt5_audit.py --csv tv26-strategy-results/TV26_Audit_XAUUSD_26102327.csv --report tv26-strategy-results/data-integrity-report.md --json tv26-strategy-results/data-integrity-report.json
          if ($LASTEXITCODE -ne 0) { throw "OHLC integrity audit failed." }

      - name: Compare 26 component votes with independent public formulas
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python trading-lab/tv26/reference_tv26_formulas.py --audit tv26-strategy-results/TV26_Audit_XAUUSD_26102327.csv --history tv26-strategy-results/TV26_OHLC_History_XAUUSD.csv --report tv26-strategy-results/formula-parity-report.md --details tv26-strategy-results/formula-parity-details.csv --json tv26-strategy-results/formula-parity-report.json
          if ($LASTEXITCODE -ne 0) { throw "Independent formula audit failed." }

      - name: Add A/B arm metrics to job summary
        if: always()
        shell: pwsh
        run: |
          "## ${{ matrix.window }} — opposite-after-loss latch=${{ matrix.opposite_gate }}" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          "Window $env:TV26_TEST_FROM to $env:TV26_TEST_TO (exclusive); Model 4; risk 1%; SL 2 ATR; TP 4 ATR; M1 breakout true; global cooldown 0." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          foreach ($name in @("strategy-backtest-summary.txt","data-integrity-report.md","formula-parity-report.md")) {
            $p = Join-Path "tv26-strategy-results" $name
            if (Test-Path -LiteralPath $p) {
              Get-Content -LiteralPath $p | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            } else {
              "MISSING: $name — incomplete infrastructure arm, not a strategy result." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            }
          }

      - name: Upload complete arm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv26-loss-latch-${{ matrix.window }}-${{ matrix.opposite_gate }}-${{ github.run_id }}
          path: tv26-strategy-results/
          if-no-files-found: warn
          retention-days: 30
