name: GoldLab MT5 Model 4 Bidirectional Diagnostic

on:
  push:
    branches: [gold-xauusd-expert-lab]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/scripts/goldlab_adx25_model4_bidirectional_diagnostic.ps1"
      - ".github/workflows/goldlab-mt5-bidirectional-diagnostic.yml"
  pull_request:
    branches: [main]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/scripts/goldlab_adx25_model4_bidirectional_diagnostic.ps1"
      - ".github/workflows/goldlab-mt5-bidirectional-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldlab-shared-headway-mt5
  queue: max
  cancel-in-progress: false

jobs:
  bidirectional-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
    steps:
      - name: Checkout GoldLab research branch
        uses: actions/checkout@v4

      - name: Run Model=4 bidirectional diagnostic with strict historical tick gate
        shell: pwsh
        run: |
          .github/scripts/goldlab_adx25_model4_bidirectional_diagnostic.ps1

      - name: Upload bidirectional diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldlab-mt5-adx25-bidirectional-diagnostic-${{ github.run_id }}
          path: goldlab-results/
          if-no-files-found: warn
          retention-days: 90
