name: GoldLab SLTP Race Diagnostic — Static Validation

on:
  push:
    branches: [goldlab-sltp-race-diagnostic]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_sltp_race_diagnostic.ps1"
      - ".github/workflows/goldlab-sltp-race-static.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldlab-sltp-race-static
  cancel-in-progress: true

jobs:
  parse-and-controls:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@v4

      - name: Parse diagnostic wrapper and verify safe experiment controls
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scriptPath = ".github/scripts/goldlab_sltp_race_diagnostic.ps1"
          $sourcePath = "trading-lab/gold-xauusd/GoldLabEA.mq5"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $scriptPath).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) { Write-Host ("line {0}: {1}" -f $e.Extent.StartLineNumber, $e.Message) }
            throw "SLTP race diagnostic wrapper has PowerShell parse errors."
          }
          $wrapper = Get-Content -LiteralPath $scriptPath -Raw
          $ea = Get-Content -LiteralPath $sourcePath -Raw
          $controls = @(
            @{ Name = "EA version 1.017"; Pass = $ea.Contains('#property version   "1.016"') },
            @{ Name = "SLTP post-response state telemetry in EA"; Pass = $ea.Contains("SLTP_MODIFY_STATE") },
            @{ Name = "forced invalid-stop injection is off by default and tester-only"; Pass = ($ea.Contains("input bool             InpTestForceInvalidStopsOnce = false;") -and $ea.Contains("if(InpTestForceInvalidStopsOnce && !testerMode)") -and $ea.Contains("(bool)MQLInfoInteger(MQL_TESTER)")) },
            @{ Name = "forced invalid stop occurs only after OrderCheck and before OrderSend"; Pass = (($ea.IndexOf('PreflightTradeRequest(request,"open")') -ge 0) -and ($ea.IndexOf('PreflightTradeRequest(request,"open")') -lt $ea.IndexOf('request.sl=request.price;')) -and ($ea.IndexOf('request.sl=request.price;') -lt $ea.IndexOf('bool sent=OrderSend(request,result);')) -and $ea.Contains('outcome=confirmed;request_id=')) },
            @{ Name = "planned SL/TP are restored before bounded retry"; Pass = ($ea.Contains("request.sl=plannedSL;") -and $ea.Contains("request.tp=plannedTP;") -and $ea.Contains("trigger_request_id=")) },
            @{ Name = "same-window real-tick Random Delay mode"; Pass = ($wrapper.Contains("ExecutionMode=-1") -and $wrapper.Contains("Model=4") -and $wrapper.Contains("ToDate=2026.10.20")) },
            @{ Name = "stale-position failures correlated by request_id"; Pass = ($wrapper.Contains("failedModifyRequestIds") -and $wrapper.Contains("staleClosedRequestIds") -and $wrapper.Contains("request_id=")) },
            @{ Name = "still-open failures remain a hard rejection"; Pass = ($wrapper.Contains("stillOpenFailureRequestIds.Count -eq 0") -and $wrapper.Contains("reject robustness run")) },
            @{ Name = "raw failed calls remain counted and are never relabelled accepted"; Pass = ($wrapper.Contains("raw failed requests=$sendFailTotal") -and $wrapper.Contains("Raw OrderSend failures: $sendFailTotal") -and $wrapper.Contains("none is relabelled accepted")) },
            @{ Name = "bounded open retry triggers only for invalid stops"; Pass = ($ea.Contains("if(!accepted && result.retcode==TRADE_RETCODE_INVALID_STOPS)") -and $ea.Contains('RecordOrderSendTelemetry("open-retryable-stop-reject"')) },
            @{ Name = "retry requires a fresh valid quote and spread guard"; Pass = ($ea.Contains("SymbolInfoTick(_Symbol,tick)") -and $ea.Contains("retrySpreadPoints>InpMaxSpreadPoints")) },
            @{ Name = "retry recalculates volume against revised stop risk and explicitly rejects sub-minimum risk lots"; Pass = ($ea.Contains("LotsForRisk(type,retryEntry,retrySL)") -and $ea.Contains("volume_below_minimum") -and $ea.Contains("RiskRejectDetail(type,retryEntry,retrySL)")) },
            @{ Name = "retry passes OrderCheck again before second send"; Pass = ($ea.Contains('PreflightTradeRequest(request,"open-retry")') -and $ea.Contains('RecordOrderSendTelemetry("open-retry"')) },
            @{ Name = "retry counters are emitted in final recovery summary"; Pass = ($ea.Contains("open_stop_retry_attempts=") -and $ea.Contains("open_stop_retry_recovered=") -and $ea.Contains("open_stop_retry_failed=")) },
            @{ Name = "retry-only ATR buffer is bounded and has 0.50 ATR default"; Pass = ($ea.Contains("InpStopRetryBufferATR   = 0.50") -and $ea.Contains("InpStopRetryBufferATR<0.0 || InpStopRetryBufferATR>2.0")) },
            @{ Name = "ATR buffer is applied only to the invalid-stop retry and volume is recalculated"; Pass = ($ea.Contains("if(!accepted && result.retcode==TRADE_RETCODE_INVALID_STOPS)") -and $ea.Contains("retryBufferDistance=InpStopRetryBufferATR*retryATR") -and $ea.Contains("retryRiskDistance=retryBaseRiskDistance+retryBufferDistance") -and $ea.Contains("LotsForRisk(type,retryEntry,retrySL)")) },
            @{ Name = "retry emits fresh-quote and stop-distance diagnostics"; Pass = ($ea.Contains("retry_buffer_distance=") -and $ea.Contains("retry_risk_distance=") -and $ea.Contains("stops_level_points=") -and $ea.Contains("freeze_level_points=")) },
            @{ Name = "retry outcomes are correlated to original INVALID_STOPS request"; Pass = ($wrapper.Contains("InpStopRetryBufferATR=0.50||0.50||0.05||0.50||N") -and $wrapper.Contains("InpStopRetryBufferATR=0\.5(?:0+)?</b>") -and $wrapper.Contains("safeAbortedOpenRequestIds") -and $wrapper.Contains("recoveredOpenRequestIds") -and $wrapper.Contains("rejectedOpenRetryTriggerRequestIds") -and $ea.Contains("trigger_request_id=") -and $ea.Contains("outcome=safe_no_retry_send") -and $ea.Contains("outcome=recovered") -and $ea.Contains("outcome=retry_send_rejected")) },
            @{ Name = "harness accounts for both recovered and safely refused bounded retries"; Pass = ($wrapper.Contains("retryableOpenRequestIds") -and $wrapper.Contains("failedOpenRetryRequestIds") -and $wrapper.Contains("openStopRetryRecovered + $openStopRetryFailed") -and $wrapper.Contains("safe rejection with no order/deal") -and $wrapper.Contains("unclassifiableSendFailureSequences")) },
            @{ Name = "development-only interval is enforced"; Pass = ($wrapper.Contains("ToDate=2026.10.20") -and -not $wrapper.Contains("ToDate=2026.10.21")) }
          )
          $bad = $false
          foreach ($control in $controls) {
            if ($control.Pass) { Write-Host ("CONTROL PASS: " + $control.Name) }
            else { Write-Host ("CONTROL FAIL: " + $control.Name); $bad = $true }
          }
          if ($bad) { throw "SLTP race static controls failed." }
          Write-Host "SLTP race PowerShell parse and static controls: PASS. No MT5 test was executed."
