name: Bitcoin Intelligence Lab Windows Runtime

on:
  push:
    branches: [bitcoin-intelligence-lab]
    paths:
      - "Bitcoin_Intelligence_Lab/**"
      - ".github/workflows/bitcoin-intelligence-lab-windows.yml"
  pull_request:
    paths:
      - "Bitcoin_Intelligence_Lab/**"
      - ".github/workflows/bitcoin-intelligence-lab-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-market-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Bitcoin_Intelligence_Lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Bitcoin_Intelligence_Lab/pyproject.toml
      - name: Install Windows collector and dashboard dependencies
        run: python -m pip install "streamlit>=1.43,<2" "websockets>=14,<16"
      - name: Compile package and run deterministic tests on Windows
        run: |
          python -m compileall -q bitcoinlab app.py scripts
          python -m unittest discover -s tests -v
      - name: Parse Windows supervisor script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts\\BitcoinIntelligenceLabSupervisor.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Output 'PASS: supervisor PowerShell syntax'
      - name: Compile the real Bitcoin EA with MetaEditor (no login or trading)
        shell: pwsh
        run: ./scripts/compile_mql5_ea.ps1
      - name: Run live Windows WebSocket, SQLite and Streamlit integration
        run: python scripts/windows_runtime_smoke.py --duration-seconds 180 --port 8502

      - name: Install Playwright browser test tools
        run: |
          python -m pip install "playwright>=1.52,<2"
          python -m playwright install chromium firefox

      - name: Test dashboard in real Chromium and Firefox
        run: python scripts/dashboard_browser_check.py --output artifacts/dashboard_browser

      - name: Upload Windows runtime logs and SQLite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-windows-runtime-smoke
          path: |
            Bitcoin_Intelligence_Lab/artifacts/windows_runtime_smoke.json
            Bitcoin_Intelligence_Lab/artifacts/dashboard_browser/**
            Bitcoin_Intelligence_Lab/artifacts/windows_market_stream.log
            Bitcoin_Intelligence_Lab/artifacts/windows_streamlit.log
            Bitcoin_Intelligence_Lab/data/windows_runtime.sqlite
            Bitcoin_Intelligence_Lab/artifacts/mql5_compile_report.txt
            Bitcoin_Intelligence_Lab/artifacts/BitcoinIntelligenceLabEA_metaeditor.log
            Bitcoin_Intelligence_Lab/artifacts/BitcoinIntelligenceLabEA.ex5
          if-no-files-found: warn
          retention-days: 7
