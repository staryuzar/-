name: TV26 headless cloud MT5 indicator audit

on:
  push:
    branches:
      - tv26-five-timeframes-arabic-candidate
    paths:
      - "trading-lab/tv26/TV26_FiveTF_Arabic_CANDIDATE.mq5"
      - ".github/scripts/tv26_cloud_audit.ps1"
      - "trading-lab/tv26/validate_tv26_mt5_audit.py"
      - ".github/workflows/tv26-cloud-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv26-cloud-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python for evidence validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated MT5 Strategy Tester audit (trading disabled)
        shell: pwsh
        run: ./.github/scripts/tv26_cloud_audit.ps1
      - name: Validate exported audit CSV and aggregate arithmetic
        shell: bash
        run: >-
          python trading-lab/tv26/validate_tv26_mt5_audit.py
          --csv tv26-cloud-results/TV26_Audit_XAUUSD_26102326.csv
          --report tv26-cloud-results/data-integrity-report.md
          --json tv26-cloud-results/data-integrity-report.json
      - name: Upload cloud audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv26-cloud-audit-${{ github.run_id }}
          path: tv26-cloud-results/
          if-no-files-found: warn
          retention-days: 30
