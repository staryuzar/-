name: GoldLab ADX25 — Stop 0.60 ATR Controlled Test

on:
  push:
    branches: [goldlab-adx25-stop060-experiment]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_adx25_stop060_experiment.ps1"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/workflows/goldlab-adx25-stop060-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldlab-shared-headway-mt5
  queue: max
  cancel-in-progress: false

jobs:
  stop060-experiment:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
    steps:
      - name: Checkout isolated ADX25 stop 0.60 ATR candidate
        uses: actions/checkout@v4

      - name: Compile and run MT5 real-tick diagnostic
        shell: pwsh
        run: .github/scripts/goldlab_adx25_stop060_experiment.ps1

      - name: Upload HTML report, CSV audit, logs and gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldlab-adx25-stop060-${{ github.run_id }}
          path: |
            goldlab-results/
            goldlab-ordercheck-preflight.txt
          if-no-files-found: warn
          retention-days: 90
