name: Aurora live assistant browser E2E

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: aurora-live-assistant-e2e-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  live-assistant-e2e:
    name: Live Gemini -> Chrome -> assistant answer
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release-package-cleanliness')
      ||
      (github.event_name == 'issue_comment'
       && github.repository == 'staryuzar/-'
       && github.event.issue.number == 4
       && github.event.issue.pull_request != null
       && github.event.comment.body == '/run-live-assistant-e2e'
       && github.event.comment.user.login == 'staryuzar')
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4
        with:
          ref: release-package-cleanliness

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract clean assistant source
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "Aurora_Control_Room_v2_4_0_FIRST_RUN_READY_AR.zip" -DestinationPath "ci_live_e2e_source" -Force
          if (!(Test-Path "ci_live_e2e_source/app.py")) { throw "app.py missing from clean source archive" }

      - name: Apply the same reviewed release fixes and knowledge pack
        shell: pwsh
        run: |
          python .github/scripts/ci_prepare_release.py ci_live_e2e_source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/ci_enrich_knowledge.py ci_live_e2e_source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Cap model/tool rounds for this isolated live test; do not alter the shipping source archive.
          $app = Join-Path $PWD "ci_live_e2e_source\app.py"
          $source = [System.IO.File]::ReadAllText($app, [System.Text.Encoding]::UTF8)
          $original = 'MAX_TOOL_ROUNDS = 1000  # High emergency ceiling; normal tasks finish when the model returns a final answer.'
          if (!$source.Contains($original)) { throw "Could not locate the expected tool-round ceiling; refusing a fuzzy test patch." }
          $source = $source.Replace($original, 'MAX_TOOL_ROUNDS = 4  # Temporary E2E-only safety cap.')
          [System.IO.File]::WriteAllText($app, $source, [System.Text.UTF8Encoding]::new($false))

      - name: Install assistant and real browser dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r ci_live_e2e_source/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run one live user-to-tool-to-answer task
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.8-flash
          AURORA_LIVE_E2E_TIMEOUT_SECONDS: "210"
        shell: pwsh
        run: |
          python -m py_compile .github/scripts/live_assistant_browser_e2e.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/live_assistant_browser_e2e.py 2>&1 | Tee-Object -FilePath live-assistant-browser-e2e-console.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload sanitized E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-assistant-browser-e2e-report
          path: |
            live-assistant-browser-e2e-report.txt
            live-assistant-browser-e2e-console.txt
          if-no-files-found: warn
