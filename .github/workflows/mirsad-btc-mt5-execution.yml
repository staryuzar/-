name: Mirsad BTC — MT5 OPEN/CLOSE EA runtime and execution permissions

on:
  push:
    branches: [mini]
    paths:
      - 'Mirsad_BTC/mt5/Mirsad_BTC_ExecutionBridge.mq5'
      - 'Mirsad_BTC/scripts/mirsad_mt5_execution_run.ps1'
      - 'Mirsad_BTC/scripts/mirsad_mt5_execution_acceptance.py'
      - 'Mirsad_BTC/mirsad/engines/mt5_bridge.py'
      - 'Mirsad_BTC/mirsad/engines/position_ledger.py'
      - '.github/workflows/mirsad-btc-mt5-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize live acceptance transactions so two commits never trade the same account concurrently.
  group: mirsad-mt5-execution-acceptance
  cancel-in-progress: false

jobs:
  compile-attach-heartbeat:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout Mirsad project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw 'MetaTrader 5 requires a Windows runner.' }
          Write-Output "Windows runner: $([System.Environment]::OSVersion.VersionString)"

      - name: Set up Python for the MIR1 acceptance bridge
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile MIR1 EA, verify MT5 permissions and run BUY/CLOSE acceptance
        env:
          MT5_CREDENTIALS: ${{ secrets.mt5 }}
        shell: pwsh
        run: ./Mirsad_BTC/scripts/mirsad_mt5_execution_run.ps1

      - name: Upload compiled expert and sanitized runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirsad-btc-mt5-execution-build
          path: |
            ${{ runner.temp }}/mirsad-mt5-execution-check/evidence/mirsad-execution-report.txt
            ${{ runner.temp }}/mirsad-mt5-execution-check/evidence/Mirsad_BTC_ExecutionBridge_compile.log
            ${{ runner.temp }}/mirsad-mt5-execution-check/evidence/Mirsad_BTC_ExecutionBridge.ex5
            ${{ runner.temp }}/mirsad-mt5-execution-check/evidence/mirsad-live-telemetry.json
            ${{ runner.temp }}/mirsad-mt5-execution-check/evidence/mirsad-order-acceptance.json
            ${{ runner.temp }}/mirsad-mt5-execution-check/evidence/mirsad-order-acceptance.log
          if-no-files-found: warn
          retention-days: 14
