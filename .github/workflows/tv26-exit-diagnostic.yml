name: TV26 matched early-exit A/B (isolated MT5 tester only)

on:
  push:
    branches:
      - tv26-exit-diagnostic-study
    paths:
      - ".github/scripts/tv26_strategy_backtest.ps1"
      - ".github/scripts/tv26_exit_diagnostic_retry.ps1"
      - ".github/workflows/tv26-exit-diagnostic.yml"
      - "trading-lab/tv26/TV26_FiveTF_Arabic_CANDIDATE.mq5"
      - "trading-lab/tv26/test_tv26_exit_contract.py"
      - "trading-lab/tv26/compare_tv26_exit_ab.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv26-exit-diagnostic-study
  cancel-in-progress: false

jobs:
  tester:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
      TV26_TEST_FROM: "2026.09.01"
      TV26_TEST_TO: "2026.09.04"
      TV26_TEST_MODEL: "4"
      TV26_TEST_RISK_PERCENT: "2.00"
      TV26_TEST_STOP_ATR: "5.00"
      TV26_TEST_TARGET_ATR: "20.00"
      TV26_TEST_REQUIRE_M1_BREAKOUT: "false"
      TV26_TEST_STAGE: "tv26-exit-ab-shared"
    steps:
      - name: Checkout diagnostic candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run TV26 entry/exit contract checks
        shell: pwsh
        run: python trading-lab/tv26/test_tv26_exit_contract.py
      - name: Install formula-audit dependencies
        run: python -m pip install -r trading-lab/tv26/requirements-formula-audit.txt
      - name: Run matched exit-on / exit-off Strategy Tester arms sequentially
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $savedCredentials = [string]$env:MT5_CREDENTIALS
          $runner = Join-Path $PWD ".github/scripts/tv26_exit_diagnostic_retry.ps1"
          $arms = @(
            [pscustomobject]@{ Name = "tv26-exit-a-on"; Magic = "26102481"; EarlyExit = "true" },
            [pscustomobject]@{ Name = "tv26-exit-b-off"; Magic = "26102482"; EarlyExit = "false" }
          )
          foreach ($arm in $arms) {
            $env:MT5_CREDENTIALS = $savedCredentials
            $env:TV26_TEST_MAGIC = $arm.Magic
            $env:TV26_TEST_USE_EARLY_EXIT = $arm.EarlyExit
            $env:TV26_TEST_STAGE = "tv26-exit-ab-shared"
            $results = Join-Path $PWD "tv26-strategy-results"
            $retryBackup = Join-Path $PWD "tv26-exit-diagnostic-attempt-1"
            $destination = Join-Path $PWD $arm.Name
            if (Test-Path -LiteralPath $results) { Remove-Item -LiteralPath $results -Recurse -Force }
            if (Test-Path -LiteralPath $retryBackup) { Remove-Item -LiteralPath $retryBackup -Recurse -Force }
            & $runner
            if (!(Test-Path -LiteralPath (Join-Path $results "strategy-backtest-summary.txt")) -or
                !(Test-Path -LiteralPath (Join-Path $results "strategy-tester-report.html"))) {
              throw "Tester arm $($arm.Name) did not produce both summary and HTML report."
            }
            if (Test-Path -LiteralPath $destination) { Remove-Item -LiteralPath $destination -Recurse -Force }
            Move-Item -LiteralPath $results -Destination $destination
            if (Test-Path -LiteralPath $retryBackup) {
              Move-Item -LiteralPath $retryBackup -Destination (Join-Path $destination "retry-attempt-1")
            }
            if ($arm.EarlyExit -eq "true") {
              # Preserve the on-arm logs above, then clear only this ephemeral runner's MT5 logs.
              # The off arm must not inherit the on arm's TV26_EXIT_* events.
              $logRoots = @(
                (Join-Path $env:RUNNER_TEMP "tv26-strategy-backtest-tv26-exit-ab-shared	erminal"),
                (Join-Path $env:APPDATA "MetaQuotesTerminal"),
                (Join-Path $env:LOCALAPPDATA "MetaQuotesTerminal")
              )
              foreach ($logRoot in $logRoots) {
                if (Test-Path -LiteralPath $logRoot) {
                  Get-ChildItem -LiteralPath $logRoot -Filter "*.log" -File -Recurse -ErrorAction SilentlyContinue |
                    Remove-Item -Force -ErrorAction SilentlyContinue
                }
              }
            }
          }
          $env:MT5_CREDENTIALS = $null
      - name: Validate exit-on MT5 audit data
        shell: bash
        run: >-
          python trading-lab/tv26/validate_tv26_mt5_audit.py
          --csv tv26-exit-a-on/TV26_Audit_XAUUSD_26102481.csv
          --report tv26-exit-a-on/data-integrity-report.md
          --json tv26-exit-a-on/data-integrity-report.json
      - name: Validate exit-off MT5 audit data
        shell: bash
        run: >-
          python trading-lab/tv26/validate_tv26_mt5_audit.py
          --csv tv26-exit-b-off/TV26_Audit_XAUUSD_26102482.csv
          --report tv26-exit-b-off/data-integrity-report.md
          --json tv26-exit-b-off/data-integrity-report.json
      - name: Compare formulas for exit-on arm
        shell: bash
        run: >-
          python trading-lab/tv26/reference_tv26_formulas.py
          --audit tv26-exit-a-on/TV26_Audit_XAUUSD_26102481.csv
          --history tv26-exit-a-on/TV26_OHLC_History_XAUUSD.csv
          --report tv26-exit-a-on/formula-parity-report.md
          --details tv26-exit-a-on/formula-parity-details.csv
          --json tv26-exit-a-on/formula-parity-report.json
      - name: Compare formulas for exit-off arm
        shell: bash
        run: >-
          python trading-lab/tv26/reference_tv26_formulas.py
          --audit tv26-exit-b-off/TV26_Audit_XAUUSD_26102482.csv
          --history tv26-exit-b-off/TV26_OHLC_History_XAUUSD.csv
          --report tv26-exit-b-off/formula-parity-report.md
          --details tv26-exit-b-off/formula-parity-details.csv
          --json tv26-exit-b-off/formula-parity-report.json
      - name: Generate matched exit A/B comparison
        shell: bash
        run: python trading-lab/tv26/compare_tv26_exit_ab.py
      - name: Upload matched diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv26-matched-exit-ab-${{ github.run_id }}
          path: |
            tv26-exit-a-on/
            tv26-exit-b-off/
            tv26-exit-diagnostic-attempt-1/
            tv26-strategy-results/
            tv26-exit-ab-comparison.md
          if-no-files-found: warn
          retention-days: 30
