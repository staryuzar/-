name: TV26 controlled exit-path diagnostic (isolated tester only)

on:
  push:
    branches:
      - tv26-exit-diagnostic-study
    paths:
      - ".github/workflows/tv26-exit-diagnostic.yml"
      - ".github/scripts/tv26_strategy_backtest.ps1"
      - ".github/scripts/tv26_exit_diagnostic_retry.ps1"
      - "trading-lab/tv26/TV26_FiveTF_Arabic_CANDIDATE.mq5"
      - "trading-lab/tv26/test_tv26_exit_contract.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv26-exit-diagnostic-study
  cancel-in-progress: false

jobs:
  tester:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
      TV26_TEST_FROM: "2026.09.01"
      TV26_TEST_TO: "2026.09.04"
      TV26_TEST_MODEL: "4"
      TV26_TEST_RISK_PERCENT: "2.00"
      TV26_TEST_STOP_ATR: "5.00"
      TV26_TEST_TARGET_ATR: "20.00"
      TV26_TEST_REQUIRE_M1_BREAKOUT: "false"
      TV26_TEST_MAGIC: "26102481"
    steps:
      - name: Checkout diagnostic candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run TV26 entry/exit contract checks before MT5
        shell: pwsh
        run: python trading-lab/tv26/test_tv26_exit_contract.py
      - name: Install formula-audit dependencies
        run: python -m pip install -r trading-lab/tv26/requirements-formula-audit.txt
      - name: Run controlled three-day exit diagnostic (tester only; widened SL/TP are diagnostic)
        shell: pwsh
        run: ./.github/scripts/tv26_exit_diagnostic_retry.ps1
      - name: Validate exported MT5 audit
        shell: bash
        run: >-
          python trading-lab/tv26/validate_tv26_mt5_audit.py
          --csv tv26-strategy-results/TV26_Audit_XAUUSD_26102481.csv
          --report tv26-strategy-results/data-integrity-report.md
          --json tv26-strategy-results/data-integrity-report.json
      - name: Compare formulas against independent public-reference implementation
        shell: bash
        run: >-
          python trading-lab/tv26/reference_tv26_formulas.py
          --audit tv26-strategy-results/TV26_Audit_XAUUSD_26102481.csv
          --history tv26-strategy-results/TV26_OHLC_History_XAUUSD.csv
          --report tv26-strategy-results/formula-parity-report.md
          --details tv26-strategy-results/formula-parity-details.csv
          --json tv26-strategy-results/formula-parity-report.json
      - name: Summarize unique rule-based exit events
        if: always()
        shell: pwsh
        run: |
          $logs = @()
          foreach ($root in @("tv26-strategy-results","tv26-exit-diagnostic-attempt-1")) {
            if (Test-Path -LiteralPath $root) { $logs += @(Get-ChildItem -LiteralPath $root -Filter "*.txt" -File -Recurse -ErrorAction SilentlyContinue) }
          }
          $unique = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $markers = @("TV26_EXIT_TRIGGER;","TV26_EXIT_COMPLETED;","TV26_EXIT_FAILED;")
          foreach ($f in $logs) {
            foreach ($line in @(Get-Content -LiteralPath $f.FullName -ErrorAction SilentlyContinue)) {
              foreach ($marker in $markers) {
                $idx = $line.IndexOf($marker,[System.StringComparison]::Ordinal)
                if ($idx -ge 0) { [void]$unique.Add($line.Substring($idx).Trim()); break }
              }
            }
          }
          $events = @($unique)
          $triggerEvents = @($events | Where-Object { $_.StartsWith("TV26_EXIT_TRIGGER;") })
          $doneEvents = @($events | Where-Object { $_.StartsWith("TV26_EXIT_COMPLETED;") })
          $failedEvents = @($events | Where-Object { $_.StartsWith("TV26_EXIT_FAILED;") })
          $opposite = @($triggerEvents | Where-Object { $_ -match "reason=OPPOSITE_SUMMARY" }).Count
          $reversal = @($triggerEvents | Where-Object { $_ -match "reason=REAL_M1_REVERSAL" }).Count
          $paired = 0
          foreach ($triggerEvent in $triggerEvents) {
            $m = [regex]::Match($triggerEvent, "ticket=(\d+)")
            if ($m.Success) {
              $ticket = $m.Groups[1].Value
              if (@($doneEvents | Where-Object { $_ -match ("ticket=" + [regex]::Escape($ticket) + "(;|$)") }).Count -gt 0) { $paired++ }
            }
          }
          $verdict = "INCONCLUSIVE_NO_TRIGGER"
          if ($triggerEvents.Count -gt 0 -and $paired -eq $triggerEvents.Count -and $failedEvents.Count -eq 0) { $verdict = "PASS_RUNTIME_EVIDENCE" }
          elseif ($failedEvents.Count -gt 0 -or $paired -lt $triggerEvents.Count) { $verdict = "FAIL_CLOSE_PATH" }
          $text = @(
            "# Exit-path diagnostic",
            "",
            "Isolated Strategy Tester diagnostic only; risk 2% (hard-capped by EA), SL 5 ATR and TP 20 ATR. Do not compare its P/L directly against the default 1% / 2 ATR / 4 ATR baseline.",
            "",
            "- Unique exit triggers: $($triggerEvents.Count)",
            "- Opposite-summary triggers: $opposite",
            "- Confirmed M1 reversal triggers: $reversal",
            "- Unique successful close events: $($doneEvents.Count)",
            "- Trigger tickets with a successful close event: $paired",
            "- Failed close events: $($failedEvents.Count)",
            "- Verdict: $verdict",
            "",
            "Zero triggers means inconclusive, not a pass. Duplicate terminal/tester log lines are deduplicated."
          )
          $text | Set-Content -LiteralPath "tv26-strategy-results/exit-path-diagnostic.md" -Encoding utf8
          Get-Content -LiteralPath "tv26-strategy-results/exit-path-diagnostic.md"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv26-exit-path-diagnostic-${{ github.run_id }}
          path: |
            tv26-strategy-results/
            tv26-exit-diagnostic-attempt-1/
          if-no-files-found: warn
          retention-days: 30
