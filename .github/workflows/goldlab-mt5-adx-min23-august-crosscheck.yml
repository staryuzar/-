name: GoldLab MT5 Model 4 Min ADX 23 August Cross-Period Diagnostic

on:
  push:
    branches: [gold-xauusd-expert-lab]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/scripts/goldlab_adx25_min23_august_crosscheck.ps1"
      - ".github/workflows/goldlab-mt5-adx-min23-august-crosscheck.yml"
  pull_request:
    branches: [main]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/scripts/goldlab_adx25_min23_august_crosscheck.ps1"
      - ".github/workflows/goldlab-mt5-adx-min23-august-crosscheck.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldlab-mt5-adx-min23-august-crosscheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  august-crosscheck:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
    steps:
      - name: Checkout GoldLab research branch
        uses: actions/checkout@v4

      - name: Run Model=4 August cross-period diagnostic with strict real-tick gate
        shell: pwsh
        run: |
          .github/scripts/goldlab_adx25_min23_august_crosscheck.ps1

      - name: Upload August cross-period evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldlab-mt5-adx-min23-august-crosscheck-${{ github.run_id }}
          path: goldlab-results/
          if-no-files-found: warn
          retention-days: 90
