name: GoldLab MT5 Model 4 ADX23 Short-Only Candle Control

on:
  push:
    branches: [gold-xauusd-expert-lab, goldlab-next-candidate]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/scripts/goldlab_adx25_min23_shortonly_candle_control.ps1"
      - ".github/workflows/goldlab-mt5-adx-min23-shortonly-candle-control.yml"
  pull_request:
    branches: [main]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/scripts/goldlab_adx25_min23_shortonly_candle_control.ps1"
      - ".github/workflows/goldlab-mt5-adx-min23-shortonly-candle-control.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldlab-shared-headway-mt5
  queue: max
  cancel-in-progress: false

jobs:
  short-only-control:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
    steps:
      - name: Checkout GoldLab research branch
        uses: actions/checkout@v4

      - name: Run combined-window Model=4 short-only control
        shell: pwsh
        run: |
          .github/scripts/goldlab_adx25_min23_shortonly_candle_control.ps1

      - name: Upload short-only control evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldlab-mt5-adx-min23-shortonly-candle-control-${{ github.run_id }}
          path: goldlab-results/
          if-no-files-found: warn
          retention-days: 90
