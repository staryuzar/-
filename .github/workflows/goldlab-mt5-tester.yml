name: GoldLab MT5 Strategy Tester

on:
  push:
    branches: [gold-xauusd-expert-lab]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/scripts/goldlab_3day_wrapper.ps1"
      - ".github/scripts/goldlab_10day_wrapper.ps1"
      - ".github/scripts/goldlab_forward_adx27_wrapper.ps1"
      - ".github/scripts/goldlab_final_adx27_wrapper.ps1"
      - ".github/scripts/goldlab_candle_confirm_diagnostic.ps1"
      - ".github/scripts/goldlab_adx27_control_diagnostic.ps1"
      - ".github/workflows/goldlab-mt5-tester.yml"
  pull_request:
    branches: [main]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/scripts/goldlab_3day_wrapper.ps1"
      - ".github/scripts/goldlab_10day_wrapper.ps1"
      - ".github/workflows/goldlab-mt5-tester.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldlab-mt5-tester-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-and-backtest:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Run matched ADX27 control without candle confirmation
        shell: pwsh
        run: |
          .github/scripts/goldlab_adx27_control_diagnostic.ps1

      - name: Upload test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldlab-mt5-adx27-no-candle-control-${{ github.run_id }}
          path: goldlab-results/
          if-no-files-found: warn
          retention-days: 90
