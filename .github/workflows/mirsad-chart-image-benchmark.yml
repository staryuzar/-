name: Mirsad BTC - Public Chart Image Benchmark

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: mirsad-public-chart-image-benchmark
  cancel-in-progress: false

jobs:
  real-chart-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Mirsad branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Mirsad_BTC/requirements.txt

      - name: Install chart analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Mirsad_BTC/requirements.txt

      - name: Run the analyst on public Bitcoin chart screenshots
        env:
          PYTHONPATH: Mirsad_BTC
        run: python Mirsad_BTC/scripts/public_chart_benchmark.py --output public-chart-benchmark.json

      - name: Publish diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirsad-public-chart-image-benchmark
          path: |
            public-chart-benchmark.json
            public-chart-benchmark-summary.md
          if-no-files-found: warn
          retention-days: 30
