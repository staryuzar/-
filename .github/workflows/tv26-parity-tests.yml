name: TV26 parity comparator tests

on:
  push:
    branches:
      - tv26-five-timeframes-arabic-candidate
    paths:
      - "trading-lab/tv26/**"
      - ".github/workflows/tv26-parity-tests.yml"
      - ".github/workflows/tv26-direct-tradingview-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formula-audit dependencies
        run: python -m pip install -r trading-lab/tv26/requirements-formula-audit.txt
      - name: Check Python syntax
        run: >-
          python -m py_compile
          trading-lab/tv26/compare_tv26_csv.py
          trading-lab/tv26/reference_tv26_formulas.py
          trading-lab/tv26/validate_tv26_mt5_audit.py
          trading-lab/tv26/tests/test_compare_tv26_csv.py
          trading-lab/tv26/tests/test_reference_tv26_formulas.py
          trading-lab/tv26/tests/test_validate_tv26_mt5_audit.py
      - name: Run deterministic parity tests
        run: python -m unittest discover -s trading-lab/tv26/tests -v
