name: TV26 parity comparator tests

on:
  push:
    branches:
      - tv26-five-timeframes-arabic-candidate
    paths:
      - "trading-lab/tv26/**"
      - ".github/workflows/tv26-parity-tests.yml"
      - ".github/workflows/tv26-direct-tradingview-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formula-audit dependencies
        run: python -m pip install -r trading-lab/tv26/requirements-formula-audit.txt
      - name: Install pinned Pine Script static linter
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/folknor/pine-tools/releases/download/v0.5.0/pine-lint \
            -o /tmp/pine-lint
          echo "9d2da5994ea4f5fc06a44a310ec867993e6b32d3036457f60d23ed07e15c3f87  /tmp/pine-lint" | sha256sum --check
          chmod +x /tmp/pine-lint
          /tmp/pine-lint --version
      - name: Lint TradingView Pine exporters (static analysis only)
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pine-lint --human trading-lab/tv26/TradingView_Parity_AllTF_Export.pine
          /tmp/pine-lint --human trading-lab/tv26/TradingView_Parity_Components_1TF.pine
      - name: Validate Pine exporters with TradingView compiler endpoint
        id: tv_compile
        shell: bash
        run: |
          set +e
          echo "Checking five-timeframe exporter with TradingView..."
          /tmp/pine-lint --tv --human trading-lab/tv26/TradingView_Parity_AllTF_Export.pine
          alltf_status=$?
          echo "Checking single-timeframe diagnostic exporter with TradingView..."
          /tmp/pine-lint --tv --human trading-lab/tv26/TradingView_Parity_Components_1TF.pine
          diagnostic_status=$?
          set -e
          if [[ "$alltf_status" -eq 0 && "$diagnostic_status" -eq 0 ]]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "Both Pine exporters passed TradingView compiler validation."
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "::error::TradingView compiler validation failed (AllTF=$alltf_status, diagnostic=$diagnostic_status). Python tests will still run for additional diagnostics."
          fi
      - name: Check Python syntax
        run: >-
          python -m py_compile
          trading-lab/tv26/compare_tv26_csv.py
          trading-lab/tv26/split_tv26_alltf_export.py
          trading-lab/tv26/reference_tv26_formulas.py
          trading-lab/tv26/validate_tv26_mt5_audit.py
          trading-lab/tv26/tests/test_compare_tv26_csv.py
          trading-lab/tv26/tests/test_split_tv26_alltf_export.py
          trading-lab/tv26/tests/test_alltf_pine_contract.py
          trading-lab/tv26/tests/test_reference_tv26_formulas.py
          trading-lab/tv26/tests/test_validate_tv26_mt5_audit.py
          trading-lab/tv26/tests/test_tv26_parity_pipeline_e2e.py
          trading-lab/tv26/tests/test_pine_published_formula_contract.py
      - name: Run deterministic parity tests
        run: python -m unittest discover -s trading-lab/tv26/tests -v
      - name: Enforce TradingView compiler result
        if: always()
        shell: bash
        env:
          TV_COMPILER_STATUS: ${{ steps.tv_compile.outputs.status }}
        run: |
          if [[ "$TV_COMPILER_STATUS" != "pass" ]]; then
            echo "::error::The TV26 Pine exporters did not pass TradingView compiler validation."
            exit 1
          fi
