name: Mirsad BTC — Live Data Validation
on:
  push:
    branches: [mini]
    # Documentation and report-only commits must not launch the 60-minute
    # external chart benchmark. Source, tests, scripts, protocol and MT5 changes
    # still run the integrated validation.
    paths:
      - '.github/workflows/mirsad-btc-live-validation.yml'
      - 'Mirsad_BTC/mirsad/**'
      - 'Mirsad_BTC/tests/**'
      - 'Mirsad_BTC/scripts/**'
      - 'Mirsad_BTC/requirements*.txt'
      - 'Mirsad_BTC/dashboard.py'
      - 'Mirsad_BTC/run_mirsad.py'
      - 'Mirsad_BTC/mt5/**'
      - 'Mirsad_BTC/protocol/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Do not let a long held-out image benchmark on an older commit block current validation.
  group: mirsad-btc-live-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  live-market-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Mirsad branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Mirsad_BTC/requirements.txt
      - name: Install open-source dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r Mirsad_BTC/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q Mirsad_BTC/mirsad Mirsad_BTC/dashboard.py Mirsad_BTC/run_mirsad.py Mirsad_BTC/scripts/chart_ocr_smoke.py Mirsad_BTC/scripts/validate_engine1_live_sources.py
      - name: Run Engine 1 live public-intelligence diagnostics (read-only, non-gating)
        continue-on-error: true
        env:
          PYTHONPATH: Mirsad_BTC
        run: python Mirsad_BTC/scripts/validate_engine1_live_sources.py --output engine1-live-source-report.json
      - name: Verify RapidOCR price-axis calibration on a synthetic chart
        env:
          PYTHONPATH: Mirsad_BTC
        run: python Mirsad_BTC/scripts/chart_ocr_smoke.py

      - name: Run engine, risk sizing and MIR1 bridge contract tests
        env:
          PYTHONPATH: Mirsad_BTC
        run: python -m unittest discover -s Mirsad_BTC/tests -v

      - name: Verify MT5-only market feed readiness (no external venues)
        env:
          PYTHONPATH: Mirsad_BTC
        run: python Mirsad_BTC/scripts/live_smoke.py
      - name: Upload Engine 1 live-source diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirsad-engine1-live-source-report
          path: engine1-live-source-report.json
          if-no-files-found: warn
          retention-days: 30

  held-out-crypto-chart-images:
    # Benchmark data comes from a public external dataset; do not let a temporary
    # dataset/CDN outage mask the core engine, risk and bridge test results.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Mirsad branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Mirsad_BTC/requirements.txt
      - name: Install Mirsad chart-analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Mirsad_BTC/requirements.txt
      - name: Compile chart analyzer, benchmark and tests
        run: python -m compileall -q Mirsad_BTC/mirsad/engines/chart.py Mirsad_BTC/scripts/crypto_dataset_chart_benchmark.py Mirsad_BTC/scripts/candlestick_pattern_benchmark.py Mirsad_BTC/tests
      - name: Test every held-out crypto chart image
        env:
          PYTHONPATH: Mirsad_BTC
        run: |
          python Mirsad_BTC/scripts/crypto_dataset_chart_benchmark.py \
            --split test \
            --ticker all \
            --max-images 0 \
            --workers 6 \
            --batch-size 25 \
            --output mirsad-crypto-chart-benchmark.json
      - name: Upload per-image decisions and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirsad-held-out-crypto-chart-benchmark
          path: |
            mirsad-crypto-chart-benchmark.json
            mirsad-crypto-chart-benchmark-summary.md
          if-no-files-found: warn
          retention-days: 30
