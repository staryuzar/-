name: Gold Intelligence Lab — MT5 build

# Compile-only CI: no historical Strategy Tester, backtest, or simulated trades.
# Genuine market-data verification is separate and must be read-only unless explicitly approved.

on:
  push:
    branches:
      - gold-intelligence-lab-v1
    paths:
      - "trading-lab/gold-intelligence-lab/**"
      - ".github/workflows/gold-lab-mql5-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-lab-compile-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-package:
    name: Contract tests + MetaEditor compile
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install complete dashboard runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r trading-lab/gold-intelligence-lab/python/requirements-ui.txt
          if ($LASTEXITCODE -ne 0) { throw "Dashboard dependency installation failed." }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Dashboard dependency consistency check failed." }

      - name: Import all runtime modules
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE "trading-lab/gold-intelligence-lab/python"
          python -c "import numpy, pandas, streamlit, MetaTrader5; from goldlab import analyze_ohlcv, scan_market_structure, build_advisory, fetch_bls_calendar, fetch_cftc_gold_cot, LocalAuditLedger; print('PASS: all runtime modules imported; MT5 was not initialized.')"
          if ($LASTEXITCODE -ne 0) { throw "A runtime module import failed." }
      - name: Compile Python source syntax
        shell: pwsh
        run: |
          python -m compileall -q trading-lab/gold-intelligence-lab/python/goldlab trading-lab/gold-intelligence-lab/app.py
          if ($LASTEXITCODE -ne 0) { throw "Python source syntax compilation failed." }

      - name: Start dashboard and verify local HTTP health
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"
          $project = Join-Path $env:GITHUB_WORKSPACE "trading-lab/gold-intelligence-lab"
          $env:PYTHONPATH = Join-Path $project "python"
          $log = Join-Path $env:RUNNER_TEMP "goldlab-streamlit-smoke.log"
          $err = Join-Path $env:RUNNER_TEMP "goldlab-streamlit-smoke.err"
          $app = Join-Path $project "app.py"
          $arguments = "-m streamlit run $app --server.headless true --server.address 127.0.0.1 --server.port 8765 --browser.gatherUsageStats false"
          $proc = Start-Process -FilePath "python" -ArgumentList $arguments -PassThru -WindowStyle Hidden -RedirectStandardOutput $log -RedirectStandardError $err
          $healthy = $false
          try {
            for ($i = 0; $i -lt 30; $i++) {
              if ($proc.HasExited) {
                if (Test-Path $log) { Get-Content $log -Tail 80 }
                if (Test-Path $err) { Get-Content $err -Tail 80 }
                throw "Streamlit exited before health endpoint was ready."
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8765/_stcore/health" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content.Trim() -eq "ok") {
                  $healthy = $true
                  Write-Output "PASS: Streamlit health endpoint returned HTTP 200 / ok."
                  break
                }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (!$healthy) {
              if (Test-Path $log) { Get-Content $log -Tail 80 }
              if (Test-Path $err) { Get-Content $err -Tail 80 }
              throw "Streamlit did not become healthy within 30 seconds."
            }
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Run EA safety-contract tests
        shell: pwsh
        run: |
          python -m unittest discover -s trading-lab/gold-intelligence-lab/tests -v
          if ($LASTEXITCODE -ne 0) { throw "EA contract tests failed." }

      - name: Probe official public macro data sources
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE "trading-lab/gold-intelligence-lab/python"
          python -c "from goldlab.economic_calendar import fetch_bls_calendar; r=fetch_bls_calendar(window_days=30,max_events=10,timeout_seconds=10); print('BLS_PUBLIC_SOURCE=PASS; events='+str(r['count'])+'; sha256='+r['response_sha256'][:16])"
          $blsExit = $LASTEXITCODE
          python -c "from goldlab.cot_data import fetch_cftc_gold_cot; r=fetch_cftc_gold_cot(rows_count=3,timeout_seconds=10); print('CFTC_PUBLIC_SOURCE=PASS; rows='+str(r['rows_count'])+'; latest_report='+r['latest_report_date']+'; sha256='+r['response_sha256'][:16])"
          $cotExit = $LASTEXITCODE
          if ($blsExit -ne 0 -or $cotExit -ne 0) { Write-Output "WARNING: public source probe failed or schema changed; app packaging continues." }
      - name: Install official MetaTrader 5 in isolated runner folder and compile EA
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $transcript = Join-Path $dist "build-diagnostics.txt"
          $report = Join-Path $env:RUNNER_TEMP "goldlab-mt5\build-report.txt"
          Start-Transcript -Path $transcript -Force | Out-Null
          try {
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $root = Join-Path $env:RUNNER_TEMP "goldlab-mt5"
          $installDir = Join-Path $root "terminal"
          $packageDir = Join-Path $root "package"
          $sourcePath = Join-Path $env:GITHUB_WORKSPACE "trading-lab/gold-intelligence-lab/mql5/GoldIntelligenceLabEA.mq5"
          $readmePath = Join-Path $env:GITHUB_WORKSPACE "trading-lab/gold-intelligence-lab/README_MT5_AR.md"
          $sourceDir = Join-Path $installDir "MQL5\Experts\GoldIntelligenceLab"
          $report = Join-Path $root "build-report.txt"
          New-Item -ItemType Directory -Path $installDir,$packageDir -Force | Out-Null
          if (!(Test-Path -LiteralPath $sourcePath)) { throw "EA source was not found in checkout." }

          $installer = Join-Path $root "mt5setup.exe"
          $uri = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $uri -OutFile $installer -TimeoutSec 180
          if (!(Test-Path -LiteralPath $installer) -or (Get-Item -LiteralPath $installer).Length -lt 100000) {
            throw "Official MT5 installer download is missing or unexpectedly small."
          }
          "Installer bytes: $((Get-Item -LiteralPath $installer).Length)" | Set-Content -LiteralPath $report -Encoding utf8
          $installArgs = @("/auto", ("/path:" + '"' + $installDir + '"'))
          $install = Start-Process -FilePath $installer -ArgumentList $installArgs -PassThru -Wait
          "Installer exit code: $($install.ExitCode)" | Add-Content -LiteralPath $report -Encoding utf8

          $terminal = Get-ChildItem -LiteralPath $installDir -Filter "terminal64.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $terminal) { throw "terminal64.exe was not found after official installation." }
          $metaEditor = Get-ChildItem -LiteralPath $installDir -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $metaEditor) { throw "metaeditor64.exe was not found after official installation." }
          "Terminal: $($terminal.FullName)" | Add-Content -LiteralPath $report -Encoding utf8
          "MetaEditor: $($metaEditor.FullName)" | Add-Content -LiteralPath $report -Encoding utf8
          "MT5 version: $((Get-Item -LiteralPath $terminal.FullName).VersionInfo.ProductVersion)" | Add-Content -LiteralPath $report -Encoding utf8

          New-Item -ItemType Directory -Path $sourceDir -Force | Out-Null
          $eaSource = Join-Path $sourceDir "GoldIntelligenceLabEA.mq5"
          $eaBinary = Join-Path $sourceDir "GoldIntelligenceLabEA.ex5"
          $compileLog = Join-Path $sourceDir "GoldIntelligenceLabEA.log"
          [System.IO.File]::WriteAllText($eaSource, (Get-Content -LiteralPath $sourcePath -Raw), [System.Text.UTF8Encoding]::new($false))
          $compileArgs = '/compile:"' + $eaSource + '" /log'
          $compiler = Start-Process -FilePath $metaEditor.FullName -ArgumentList $compileArgs -WorkingDirectory $installDir -PassThru
          if (!$compiler.WaitForExit(60000)) {
            Stop-Process -Id $compiler.Id -Force -ErrorAction SilentlyContinue
            throw "MetaEditor compilation timed out after 60 seconds."
          }
          Start-Sleep -Seconds 1
          if (!(Test-Path -LiteralPath $compileLog)) { throw "MetaEditor did not produce the expected compile log." }
          $compileText = Get-Content -LiteralPath $compileLog -Raw
          "Compile log: $($compileText.Trim())" | Add-Content -LiteralPath $report -Encoding utf8
          if (!(Test-Path -LiteralPath $eaBinary) -or (Get-Item -LiteralPath $eaBinary).Length -le 0) {
            throw "MetaEditor did not produce a non-empty EX5 file."
          }
          if ($compileText -notmatch '(?i)0 errors' -or $compileText -match '(?i)[1-9][0-9]* errors') {
            throw "MetaEditor did not confirm zero compile errors."
          }
          if ($compileText -notmatch '(?i)0 warnings' -or $compileText -match '(?i)[1-9][0-9]* warnings') {
            throw "MetaEditor did not confirm zero compile warnings."
          }

          Copy-Item -LiteralPath $eaSource -Destination $packageDir
          Copy-Item -LiteralPath $eaBinary -Destination $packageDir
          Copy-Item -LiteralPath $compileLog -Destination $packageDir
          Copy-Item -LiteralPath $readmePath -Destination (Join-Path $packageDir "INSTALL_AR.md")
          $hash = (Get-FileHash -LiteralPath $eaBinary -Algorithm SHA256).Hash
          "EX5 SHA256: $hash" | Add-Content -LiteralPath $report -Encoding utf8
          "RESULT: PASS — MetaEditor compiled GoldIntelligenceLabEA with zero errors and zero warnings. No account was connected and no trade was placed." | Add-Content -LiteralPath $report -Encoding utf8
          Get-Content -LiteralPath $report

          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item -LiteralPath $report -Destination (Join-Path $dist "build-report.txt")
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath (Join-Path $dist "GoldIntelligenceLab-MT5-Windows.zip") -Force
          if ((Get-Item (Join-Path $dist "GoldIntelligenceLab-MT5-Windows.zip")).Length -le 1000) { throw "Build archive is unexpectedly small." }
          } catch {
            Write-Output ("BUILD FAILED: " + $_.Exception.Message)
            Write-Output ($_ | Out-String)
            if ($report -and (Test-Path -LiteralPath $report)) { Copy-Item -LiteralPath $report -Destination (Join-Path $dist "build-report.txt") -Force }
            throw
          } finally {
            Stop-Transcript | Out-Null
          }


      - name: Package complete Gold Intelligence Lab Windows program
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = Join-Path $env:GITHUB_WORKSPACE "trading-lab/gold-intelligence-lab"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $stageRoot = Join-Path $env:RUNNER_TEMP "goldlab-local-package"
          $stage = Join-Path $stageRoot "GoldIntelligenceLab"
          $outputZip = Join-Path $dist "GoldIntelligenceLab-Local-Windows.zip"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          if (Test-Path -LiteralPath $stageRoot) { Remove-Item -LiteralPath $stageRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Get-ChildItem -LiteralPath $project -Force | Where-Object { $_.Name -notin @("__pycache__", ".venv", "data", ".pytest_cache") } | Copy-Item -Destination $stage -Recurse -Force
          $compiledZip = Join-Path $dist "GoldIntelligenceLab-MT5-Windows.zip"
          if (!(Test-Path -LiteralPath $compiledZip)) { throw "Compiled MT5 package is missing; full package will not be marked complete." }
          $releaseDir = Join-Path $stage "release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item -LiteralPath $compiledZip -Destination (Join-Path $releaseDir "GoldIntelligenceLab-MT5-Windows.zip")
          @(
            "Gold Intelligence Lab — complete local Windows package"
            "Includes the Arabic Streamlit dashboard, Python analysis modules, requirements, tests, MQL5 source, and compiled EA package."
            "No API keys, broker passwords, account numbers, or local SQLite runtime files are included."
            "The dashboard starts in read-only mode and only requests terminal data after the user clicks refresh."
            "No Strategy Tester or simulated trades are used as evidence in this package."
            "The MT5 connection must be validated on the user's logged-in terminal before market-data readiness is claimed."
          ) | Set-Content -LiteralPath (Join-Path $stage "PACKAGE_INFO_AR.txt") -Encoding utf8
          if (Test-Path -LiteralPath $outputZip) { Remove-Item -LiteralPath $outputZip -Force }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $outputZip -Force
          if (!(Test-Path -LiteralPath $outputZip) -or (Get-Item -LiteralPath $outputZip).Length -lt 20000) { throw "Complete Windows package missing or unexpectedly small." }
          Write-Output ("FULL_PROGRAM_ZIP=" + $outputZip)
          Write-Output ("FULL_PROGRAM_BYTES=" + (Get-Item -LiteralPath $outputZip).Length)

      - name: Upload complete Gold Intelligence Lab Windows program
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoldIntelligenceLab-Local-Windows
          path: dist/GoldIntelligenceLab-Local-Windows.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload compiled EA package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldIntelligenceLab-MT5-Windows
          path: |
            dist/GoldIntelligenceLab-MT5-Windows.zip
            dist/build-report.txt
            dist/build-diagnostics.txt
          if-no-files-found: warn
          retention-days: 30
