name: TV26 signal-latch state fix — Sep diagnostic and Oct cross-check

on:
  push:
    branches:
      - tv26-reentry-latch-preservation-study
    paths:
      - ".github/workflows/tv26-reentry-latch-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv26-reentry-latch-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tester:
    name: "${{ matrix.label }}"
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: sep01-10-baseline
            label: "Sep 1–10 — legacy baseline"
            latch_mode: "baseline"
            date_from: "2026.09.01"
            date_to: "2026.09.11"
          - id: sep01-10-preserve
            label: "Sep 1–10 — latch preservation"
            latch_mode: "preserve"
            date_from: "2026.09.01"
            date_to: "2026.09.11"
          - id: oct20-22-baseline
            label: "Oct 20–22 — legacy baseline"
            latch_mode: "baseline"
            date_from: "2026.10.20"
            date_to: "2026.10.23"
          - id: oct20-22-preserve
            label: "Oct 20–22 — latch preservation"
            latch_mode: "preserve"
            date_from: "2026.10.20"
            date_to: "2026.10.23"

    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
      PYTHONUTF8: "1"
      TV26_TEST_FROM: "${{ matrix.date_from }}"
      TV26_TEST_TO: "${{ matrix.date_to }}"
      TV26_TEST_MODEL: "4"
      TV26_TEST_RISK_PERCENT: "1.00"
      TV26_TEST_STOP_ATR: "2.00"
      TV26_TEST_TARGET_ATR: "4.00"
      TV26_TEST_REQUIRE_M1_BREAKOUT: "true"
      TV26_TEST_COOLDOWN_BARS: "0"
      TV26_TEST_LATCH_MODE: "${{ matrix.latch_mode }}"

    steps:
      - name: Checkout isolated signal-latch candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formula-audit dependencies
        run: python -m pip install -r trading-lab/tv26/requirements-formula-audit.txt

      - name: Run isolated A/B real-tick MT5 tester with one bounded tick-history retry
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $originalSecret = [string]$env:MT5_CREDENTIALS
          $scriptPath = ".\.github\scripts\tv26_strategy_cooldown_backtest.ps1"
          $results = Join-Path $PWD "tv26-strategy-results"
          $completed = $false
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            $env:MT5_CREDENTIALS = $originalSecret
            try {
              & $scriptPath
              $completed = $true
              break
            } catch {
              $diagDir = Join-Path $results "diagnostics"
              $transientTickFailure = $false
              if (Test-Path -LiteralPath $diagDir) {
                foreach ($logFile in @(Get-ChildItem -LiteralPath $diagDir -Filter "*.txt" -File -ErrorAction SilentlyContinue)) {
                  $logText = Get-Content -LiteralPath $logFile.FullName -Raw -ErrorAction SilentlyContinue
                  if ($logText -match "(?i)no history data, stop testing|preliminary downloading of history ticks canceled") {
                    $transientTickFailure = $true
                    break
                  }
                }
              }
              if ($attempt -ge 2 -or !$transientTickFailure) { throw }
              Write-Warning "MT5 canceled an incomplete initial tick-history download. Preserving diagnostics and retrying once."
              $failedDiag = Join-Path $results "retry-attempt-1-diagnostics"
              if (Test-Path -LiteralPath $failedDiag) { Remove-Item -LiteralPath $failedDiag -Recurse -Force }
              if (Test-Path -LiteralPath $diagDir) { Move-Item -LiteralPath $diagDir -Destination $failedDiag -Force }
              $summaryPath = Join-Path $results "strategy-backtest-summary.txt"
              if (Test-Path -LiteralPath $summaryPath) {
                Copy-Item -LiteralPath $summaryPath -Destination (Join-Path $results "retry-attempt-1-summary.txt") -Force
              }
              foreach ($fileName in @(
                "TV26_Audit_XAUUSD_26102327.csv",
                "TV26_OHLC_History_XAUUSD.csv",
                "strategy-tester-report.html",
                "data-integrity-report.md",
                "data-integrity-report.json",
                "formula-parity-report.md",
                "formula-parity-report.json",
                "formula-parity-details.csv"
              )) {
                $filePath = Join-Path $results $fileName
                if (Test-Path -LiteralPath $filePath) { Remove-Item -LiteralPath $filePath -Force }
              }
              Start-Sleep -Seconds 3
            }
          }
          $env:MT5_CREDENTIALS = $null
          if (!$completed) { throw "MT5 tester did not produce a valid result after the permitted retry." }

      - name: Validate exported MT5 audit structure
        shell: bash
        run: >-
          python trading-lab/tv26/validate_tv26_mt5_audit.py
          --csv tv26-strategy-results/TV26_Audit_XAUUSD_26102327.csv
          --report tv26-strategy-results/data-integrity-report.md
          --json tv26-strategy-results/data-integrity-report.json

      - name: Compare all 26 votes to independent published formulas
        shell: bash
        run: >-
          python trading-lab/tv26/reference_tv26_formulas.py
          --audit tv26-strategy-results/TV26_Audit_XAUUSD_26102327.csv
          --history tv26-strategy-results/TV26_OHLC_History_XAUUSD.csv
          --report tv26-strategy-results/formula-parity-report.md
          --details tv26-strategy-results/formula-parity-details.csv
          --json tv26-strategy-results/formula-parity-report.json

      - name: Publish tester result
        if: always()
        shell: pwsh
        run: |
          "## MATRIX_LABEL" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          "Source branch: research-only signal-latch state fix; risk 1%; SL 2 ATR; TP 4 ATR; M1 close breakout; cooldown 0; Model 4." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $summaryPath = "tv26-strategy-results/strategy-backtest-summary.txt"
          if (Test-Path -LiteralPath $summaryPath) {
            Get-Content -LiteralPath $summaryPath | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          } else {
            "Tester summary missing; incomplete infrastructure run, not a strategy result." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv26-reentry-latch-${{ matrix.id }}-${{ github.run_id }}
          path: tv26-strategy-results/
          if-no-files-found: warn
          retention-days: 30
# Trigger validation of the preserved signal-latch implementation.
