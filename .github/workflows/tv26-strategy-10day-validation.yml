name: TV26 10-day real-tick strategy validation matrix

on:
  push:
    branches:
      - tv26-five-timeframes-arabic-candidate
    paths:
      - ".github/workflows/tv26-strategy-10day-validation.yml"
      - ".github/scripts/tv26_strategy_backtest.ps1"
      - "trading-lab/tv26/TV26_FiveTF_Arabic_CANDIDATE.mq5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv26-10day-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tester:
    name: "${{ matrix.label }}"
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: risk050-sl2-tp3
            label: "Risk 0.50%, SL 2 ATR / TP 3 ATR — safety baseline"
            risk: "0.50"
            stop: "2.00"
            target: "3.00"
            breakout: "false"
          - id: risk100-sl2-tp3
            label: "Risk 1.00%, SL 2 ATR / TP 3 ATR — base entry"
            risk: "1.00"
            stop: "2.00"
            target: "3.00"
            breakout: "false"
          - id: risk100-sl2-tp3-breakout
            label: "Risk 1.00%, SL 2 ATR / TP 3 ATR — M1 close breakout"
            risk: "1.00"
            stop: "2.00"
            target: "3.00"
            breakout: "true"
          - id: risk100-sl15-tp225
            label: "Risk 1.00%, SL 1.5 ATR / TP 2.25 ATR — intermediate stop"
            risk: "1.00"
            stop: "1.50"
            target: "2.25"
            breakout: "false"

    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
      TV26_TEST_FROM: "2026.10.14"
      TV26_TEST_TO: "2026.10.24"
      TV26_TEST_MODEL: "4"
      TV26_TEST_RISK_PERCENT: "${{ matrix.risk }}"
      TV26_TEST_STOP_ATR: "${{ matrix.stop }}"
      TV26_TEST_TARGET_ATR: "${{ matrix.target }}"
      TV26_TEST_REQUIRE_M1_BREAKOUT: "${{ matrix.breakout }}"

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formula-audit dependencies
        run: python -m pip install -r trading-lab/tv26/requirements-formula-audit.txt

      - name: Run isolated 10-day real-tick Strategy Tester
        shell: pwsh
        run: ./.github/scripts/tv26_strategy_backtest.ps1

      - name: Validate exported MT5 audit structure
        shell: bash
        run: >-
          python trading-lab/tv26/validate_tv26_mt5_audit.py
          --csv tv26-strategy-results/TV26_Audit_XAUUSD_26102327.csv
          --report tv26-strategy-results/data-integrity-report.md
          --json tv26-strategy-results/data-integrity-report.json

      - name: Compare 26 component votes to independent published formulas
        shell: bash
        run: >-
          python trading-lab/tv26/reference_tv26_formulas.py
          --audit tv26-strategy-results/TV26_Audit_XAUUSD_26102327.csv
          --history tv26-strategy-results/TV26_OHLC_History_XAUUSD.csv
          --report tv26-strategy-results/formula-parity-report.md
          --details tv26-strategy-results/formula-parity-details.csv
          --json tv26-strategy-results/formula-parity-report.json

      - name: Add readable metrics to the Actions summary
        if: always()
        shell: pwsh
        run: |
          $summaryPath = "tv26-strategy-results/strategy-backtest-summary.txt"
          "## ${{ matrix.label }}" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if (Test-Path -LiteralPath $summaryPath) {
            Get-Content -LiteralPath $summaryPath | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          } else {
            "The tester summary file was not generated. Treat this run as incomplete." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }

      - name: Upload full run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv26-10day-${{ matrix.id }}-${{ github.run_id }}
          path: tv26-strategy-results/
          if-no-files-found: warn
          retention-days: 30
