name: GoldLab PowerShell Static Validation

on:
  push:
    branches: [goldlab-request-result-candidate]
    paths:
      - ".github/scripts/*.ps1"
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/workflows/goldlab-script-lint.yml"
      - ".github/workflows/goldlab-holdout-evaluation.yml"
      - ".github/workflows/goldlab-adxmax27-experiment.yml"
      - ".github/workflows/goldlab-randomdelay-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldlab-script-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell-parse:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Parse all GoldLab PowerShell scripts without running MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            ".github/scripts/goldlab_advisor_ordercheck_diagnostic.ps1",
            ".github/scripts/goldlab_adxmax27_experiment.ps1",
            ".github/scripts/goldlab_holdout_evaluation.ps1",
            ".github/scripts/goldlab_randomdelay_experiment.ps1",
            ".github/scripts/goldlab_mt5_test.ps1",
            ".github/scripts/goldlab_environment_preflight.ps1"
          )
          $failed = $false
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file)) {
              Write-Error "Missing required script: $file"
              $failed = $true
              continue
            }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Host "PARSE FAIL: $file"
              foreach ($parseError in $parseErrors) {
                Write-Host ("  line {0}: {1}" -f $parseError.Extent.StartLineNumber, $parseError.Message)
              }
              $failed = $true
            } else {
              Write-Host "PARSE PASS: $file ($($tokens.Count) tokens)"
            }
          }
          if ($failed) { throw "At least one GoldLab PowerShell script has a parse error." }

          # Static controls guard against accidental holdout tests or live-trading enablement.
          $diagnostic = Get-Content -LiteralPath ".github/scripts/goldlab_advisor_ordercheck_diagnostic.ps1" -Raw
          $tester = Get-Content -LiteralPath ".github/scripts/goldlab_mt5_test.ps1" -Raw
          $ea = Get-Content -LiteralPath "trading-lab/gold-xauusd/GoldLabEA.mq5" -Raw
          $holdout = Get-Content -LiteralPath ".github/scripts/goldlab_holdout_evaluation.ps1" -Raw
          $holdoutWorkflow = Get-Content -LiteralPath ".github/workflows/goldlab-holdout-evaluation.yml" -Raw
          $adxExperiment = Get-Content -LiteralPath ".github/scripts/goldlab_adxmax27_experiment.ps1" -Raw
          $adxExperimentWorkflow = Get-Content -LiteralPath ".github/workflows/goldlab-adxmax27-experiment.yml" -Raw
          $randomDelayExperiment = Get-Content -LiteralPath ".github/scripts/goldlab_randomdelay_experiment.ps1" -Raw
          $randomDelayWorkflow = Get-Content -LiteralPath ".github/workflows/goldlab-randomdelay-experiment.yml" -Raw
          $controls = @(
            @{ Name = "development ToDate fixed at 2026.10.20"; Pass = ($diagnostic.Contains("ToDate=2026.10.20") -and -not $diagnostic.Contains("ToDate=2026.10.21")) },
            @{ Name = "exact report period guard present"; Pass = ($diagnostic.Contains('2026\.08\.05 - 2026\.10\.20') -and $diagnostic.Contains('Period:')) },
            @{ Name = "HTML/CSV/deal/date reconciliation gate present"; Pass = ($diagnostic.Contains("MT5 HTML") -and $diagnostic.Contains("deal CSV/date-quality gate")) },
            @{ Name = "development tick-coverage thresholds are enforced"; Pass = ($diagnostic.Contains("minimum 10000") -and $diagnostic.Contains("minimum 1000000")) },
            @{ Name = "tester explicitly disables live trading"; Pass = $tester.Contains("AllowLiveTrading=0") },
            @{ Name = "EA refuses real-account execution outside tester"; Pass = $ea.Contains("accountMode==ACCOUNT_TRADE_MODE_REAL && !testerMode") },
            @{ Name = "EA checks OrderCheck and OrderSend retcodes"; Pass = ($ea.Contains("PreflightTradeRequest(request") -and $ea.Contains("TradeRetcodeAccepted(result.retcode)")) },
            @{ Name = "holdout wrapper UTC lock matches 2026-10-24T12:00:00Z"; Pass = $holdout.Contains("2026-10-24T12:00:00Z") },
            @{ Name = "holdout wrapper pins expected EA hash"; Pass = $holdout.Contains("149e0e84be72c92246ffca6be1a8c566d4b99645f941d12ebebc3aff0bd4755c") },
            @{ Name = "holdout report boundary uses 2026.10.21 through 2026.10.24"; Pass = ($holdout.Contains("FromDate=2026.10.21") -and $holdout.Contains("ToDate=2026.10.24")) },
            @{ Name = "holdout CSV gate has exclusive end bound"; Pass = $holdout.Contains("2026.10.24 00:00:00") -and $holdout.Contains("Out-of-window CSV deals") },
            @{ Name = "holdout has minimum tick coverage gates"; Pass = ($holdout.Contains("minimum 500") -and $holdout.Contains("minimum 100000")) },
            @{ Name = "holdout workflow trigger is restricted to explicit trigger file"; Pass = ($holdoutWorkflow -match '(?s)on:\s*push:\s*branches:\s*\[goldlab-request-result-candidate\]\s*paths:\s*-\s*"trading-lab/gold-xauusd/HOLDOUT_RUN_TRIGGER\.md"\s*\r?\n\s*\r?\npermissions:') },
            @{ Name = "holdout consumption lock is pushed before MT5 test step"; Pass = ($holdoutWorkflow.IndexOf("git push origin") -ge 0 -and $holdoutWorkflow.IndexOf("git push origin") -lt $holdoutWorkflow.IndexOf("Compile frozen EA and run the protected holdout exactly once")) },
            @{ Name = "holdout workflow pins frozen commit and source hash"; Pass = ($holdoutWorkflow.Contains("b3ff34caa837ce07e508ce9f8033123d737b7940") -and $holdoutWorkflow.Contains("149e0e84be72c92246ffca6be1a8c566d4b99645f941d12ebebc3aff0bd4755c")) },
            @{ Name = "ADX27 experiment changes only the upper ADX setting"; Pass = ($adxExperiment.Contains("InpMaxADX=27.0||27.0||1.0||27.0||N") -and $adxExperiment.Contains("InpMinADX=23.0||23.0||1.0||23.0||N") -and $tester.Contains("InpStopATR=0.45||0.45||0.05||0.45||N")) },
            @{ Name = "ADX27 experiment remains in the development window"; Pass = ($adxExperiment.Contains("FromDate=2026.08.05") -and $adxExperiment.Contains("ToDate=2026.10.20") -and -not $adxExperiment.Contains("ToDate=2026.10.24")) },
            @{ Name = "ADX27 workflow runs only isolated dev experiment and uploads its artifact"; Pass = ($adxExperimentWorkflow.Contains("goldlab_adxmax27_experiment.ps1") -and $adxExperimentWorkflow.Contains("goldlab-adxmax27-") -and -not $adxExperimentWorkflow.Contains("HOLDOUT_RUN_TRIGGER.md")) },
            @{ Name = "Random Delay experiment pins ExecutionMode=-1 while preserving ADX25 inputs"; Pass = ($randomDelayExperiment.Contains("ExecutionMode=-1") -and $randomDelayExperiment.Contains("Random Delay") -and $randomDelayExperiment.Contains("InpMaxADX=25")) },
            @{ Name = "Random Delay experiment stays on the development date window"; Pass = ($randomDelayExperiment.Contains("ToDate=2026.10.20") -and -not $randomDelayExperiment.Contains("ToDate=2026.10.24")) },
            @{ Name = "Random Delay workflow uses only its isolated runner and artifact"; Pass = ($randomDelayWorkflow.Contains("goldlab_randomdelay_experiment.ps1") -and $randomDelayWorkflow.Contains("goldlab-randomdelay-") -and -not $randomDelayWorkflow.Contains("HOLDOUT_RUN_TRIGGER.md")) }
          )
          foreach ($control in $controls) {
            if ($control.Pass) { Write-Host ("CONTROL PASS: " + $control.Name) }
            else { Write-Host ("CONTROL FAIL: " + $control.Name); $failed = $true }
          }
          if ($failed) { throw "PowerShell parsing or holdout/live-trading static controls failed." }
          Write-Host "GoldLab syntax and safety gate: PASS. No MT5 installation, account login, or strategy test executed."

      - name: Validate protected holdout transformation without launching MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:GOLDLAB_PREFLIGHT_ONLY = "true"
          . .github/scripts/goldlab_holdout_evaluation.ps1
          Write-Host "Holdout transform preflight passed without running Strategy Tester."

