name: Mirsad BTC - Held-out Candlestick Pattern Image Benchmark

on:
  push:
    branches: [mini]
    paths:
      - 'Mirsad_BTC/mirsad/engines/chart*.py'
      - 'Mirsad_BTC/dashboard.py'
      - 'Mirsad_BTC/mirsad/runtime.py'
      - 'Mirsad_BTC/scripts/candlestick_pattern_benchmark.py'
      - '.github/workflows/mirsad-pattern-image-benchmark.yml'
  workflow_dispatch:
    inputs:
      batch_size:
        description: Images per auditable batch
        required: true
        default: '25'
        type: string
      max_images:
        description: 0 means all held-out images
        required: true
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: mirsad-pattern-image-benchmark
  cancel-in-progress: false

jobs:
  held-out-pattern-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Mirsad branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Mirsad_BTC/requirements.txt

      - name: Install Mirsad chart-analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Mirsad_BTC/requirements.txt

      - name: Compile pattern benchmark and chart analyzer
        run: python -m compileall -q Mirsad_BTC/mirsad/engines Mirsad_BTC/scripts/candlestick_pattern_benchmark.py Mirsad_BTC/tests

      - name: Evaluate every held-out labelled candlestick chart
        env:
          PYTHONPATH: Mirsad_BTC
        run: |
          python Mirsad_BTC/scripts/candlestick_pattern_benchmark.py \
            --batch-size "${{ github.event.inputs.batch_size || '25' }}" \
            --max-images "${{ github.event.inputs.max_images || '0' }}" \
            --workers 4 \
            --output mirsad-candlestick-pattern-benchmark.json

      - name: Upload per-image candidates and per-batch metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirsad-held-out-candlestick-pattern-benchmark
          path: |
            mirsad-candlestick-pattern-benchmark.json
            mirsad-candlestick-pattern-benchmark-summary.md
          if-no-files-found: warn
          retention-days: 30
