name: GoldLab Protected Holdout — One-Time Evaluation

on:
  push:
    branches: [goldlab-request-result-candidate]
    paths:
      - "trading-lab/gold-xauusd/HOLDOUT_RUN_TRIGGER.md"

permissions:
  contents: write
  actions: read

concurrency:
  group: goldlab-shared-headway-mt5
  queue: max
  cancel-in-progress: false

jobs:
  holdout:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      HOLDOUT_UNLOCK_UTC: "2026-10-24T12:00:00Z"
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
    steps:
      - name: Checkout isolated candidate control files
        uses: actions/checkout@v4

      - name: Checkout frozen GoldLab source and generic MT5 runner
        uses: actions/checkout@v4
        with:
          ref: b3ff34caa837ce07e508ce9f8033123d737b7940
          path: frozen
          persist-credentials: false

      - name: Validate unlock time, frozen source, and consume one-time lock
        id: holdout_guard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $unlock = [datetime]::ParseExact($env:HOLDOUT_UNLOCK_UTC,"yyyy-MM-ddTHH:mm:ssZ",[Globalization.CultureInfo]::InvariantCulture).ToUniversalTime()
          $now = [DateTime]::UtcNow
          if ($now -lt $unlock) {
            "allowed=false" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            "HOLDOUT SKIPPED: locked until $($unlock.ToString('o')); current UTC is $($now.ToString('o')). No tester will run." | Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append
            exit 0
          }
          if ($env:GITHUB_REF_NAME -ne "goldlab-request-result-candidate") { throw "Holdout can run only on the isolated candidate branch." }
          $triggerPath = "trading-lab/gold-xauusd/HOLDOUT_RUN_TRIGGER.md"
          if (!(Test-Path -LiteralPath $triggerPath) -or (Get-Content -LiteralPath $triggerPath -Raw).Trim() -ne "RUN_GOLDLAB_HOLDOUT_V1") {
            throw "The explicit holdout trigger token is missing or invalid."
          }
          if ([string]::IsNullOrWhiteSpace([string]$env:MT5_CREDENTIALS)) { throw "GitHub Actions MT5 secret is absent; holdout was not consumed." }
          $lockPath = "trading-lab/gold-xauusd/HOLDOUT_CONSUMED.json"
          if (Test-Path -LiteralPath $lockPath) { throw "Holdout is already consumed. Do not rerun or tune on this window." }

          $frozenCommit = (& git -C frozen rev-parse HEAD).Trim()
          if ($frozenCommit -ne "b3ff34caa837ce07e508ce9f8033123d737b7940") { throw "Frozen checkout commit does not match the approved immutable source SHA." }
          $eaPath = "frozen/trading-lab/gold-xauusd/GoldLabEA.mq5"
          $eaHash = (Get-FileHash -LiteralPath $eaPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = "149e0e84be72c92246ffca6be1a8c566d4b99645f941d12ebebc3aff0bd4755c"
          if ($eaHash -ne $expectedHash) { throw "Frozen EA source SHA-256 mismatch; holdout refused." }

          # Check the latest remote branch too, so reruns of the original trigger commit see a consumed lock.
          & git fetch origin ("refs/heads/" + $env:GITHUB_REF_NAME + ":refs/remotes/origin/" + $env:GITHUB_REF_NAME)
          if ($LASTEXITCODE -ne 0) { throw "Could not refresh candidate branch before consuming holdout." }
          $remoteLock = @(& git ls-tree -r --name-only ("origin/" + $env:GITHUB_REF_NAME) -- $lockPath)
          if ($remoteLock -contains $lockPath) { throw "Remote branch already records the one-time holdout as consumed." }

          $record = [ordered]@{
            status = "CONSUMED_BEFORE_TEST"
            holdout_start_inclusive = "2026-10-21T00:00:00"
            holdout_end_exclusive = "2026-10-24T00:00:00"
            unlock_utc = $unlock.ToString("o")
            consumed_utc = $now.ToString("o")
            github_run_id = $env:GITHUB_RUN_ID
            triggering_commit = $env:GITHUB_SHA
            frozen_commit = $frozenCommit
            ea_sha256 = $eaHash
            tester_inputs = "XAUUSD M5; Model 4 real ticks; deposit 500 USD; leverage 1:1000; risk 0.50%; stop 0.45 ATR; target 2.4 ATR; trailing 1.4 ATR; spread 100; ADX 23-25; short-only; signal candle direction and fast EMA rejection required."
          }
          [System.IO.File]::WriteAllText($lockPath,($record | ConvertTo-Json -Depth 5),[System.Text.UTF8Encoding]::new($false))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $lockPath
          git commit -m "test(goldlab): consume protected holdout before evaluation"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit holdout consumption lock." }
          git push origin ("HEAD:" + $env:GITHUB_REF_NAME)
          if ($LASTEXITCODE -ne 0) { throw "Could not push one-time holdout lock; no tester will be launched." }

          "allowed=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "Holdout lock committed before test. Frozen commit: $frozenCommit; EA SHA-256: $eaHash." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Install holdout runner into frozen checkout
        if: steps.holdout_guard.outputs.allowed == 'true'
        shell: pwsh
        run: |
          $dest = "frozen/.github/scripts/goldlab_holdout_evaluation.ps1"
          New-Item -ItemType Directory -Path (Split-Path -Parent $dest) -Force | Out-Null
          Copy-Item -LiteralPath ".github/scripts/goldlab_holdout_evaluation.ps1" -Destination $dest -Force
          Write-Host "Frozen EA and generic MT5 runner remain at the pinned commit; only the separately audited holdout wrapper was copied in."

      - name: Compile frozen EA and run the protected holdout exactly once
        if: steps.holdout_guard.outputs.allowed == 'true'
        shell: pwsh
        working-directory: frozen
        env:
          MT5_CREDENTIALS: ${{ secrets.mt5 }}
        run: .github/scripts/goldlab_holdout_evaluation.ps1

      - name: Upload one-time holdout report and audit trail
        if: always() && steps.holdout_guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: goldlab-holdout-2026-10-21_to_2026-10-23-${{ github.run_id }}
          path: |
            frozen/goldlab-results/
            frozen/goldlab-ordercheck-preflight.txt
            trading-lab/gold-xauusd/HOLDOUT_CONSUMED.json
          if-no-files-found: warn
          retention-days: 90
