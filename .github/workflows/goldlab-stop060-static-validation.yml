name: GoldLab Stop060 — PowerShell Syntax and Safety Validation

on:
  push:
    branches: [goldlab-adx25-stop060-experiment]
    paths:
      - ".github/scripts/goldlab_adx25_stop060_experiment.ps1"
      - ".github/workflows/goldlab-stop060-static-validation.yml"

permissions:
  contents: read

concurrency:
  group: goldlab-stop060-static-validation
  cancel-in-progress: true

jobs:
  static-validation:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@v4

      - name: Parse PowerShell without launching MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = ".github/scripts/goldlab_adx25_stop060_experiment.ps1"
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            foreach ($errorItem in $parseErrors) {
              Write-Host ("PARSE FAIL line {0}: {1}" -f $errorItem.Extent.StartLineNumber, $errorItem.Message)
            }
            throw "Stop060 PowerShell syntax validation failed."
          }
          $script = Get-Content -LiteralPath $file -Raw
          $runner = Get-Content -LiteralPath ".github/scripts/goldlab_mt5_test.ps1" -Raw
          $checks = @(
            @{ Name = "Stop input is changed to exactly 0.60 ATR"; Pass = ($script.Contains("InpStopATR=0.60||0.60||0.05||0.60||N") -and $script.Contains("InpStopATR=0.60</b>")) },
            @{ Name = "Other trend filter remains ADX 23-25"; Pass = ($script.Contains("InpMinADX=23.0||23.0||1.0||23.0||N") -and $script.Contains("InpMaxADX=25.0||25.0||1.0||25.0||N")) },
            @{ Name = "Window is development-only ending 2026.10.20"; Pass = ($script.Contains("ToDate=2026.10.20") -and -not $script.Contains("ToDate=2026.10.21") -and $script.Contains("2026.08.05 - 2026.10.20")) },
@{ Name = "Exact report period is verified"; Pass = ($script.Contains("Period:</td>") -and $script.Contains("M5 (2026.08.05 - 2026.10.20)")) },
            @{ Name = "Live trading remains disabled"; Pass = $runner.Contains("AllowLiveTrading=0") },
            @{ Name = "CSV, report, and date reconciliation gate remains required"; Pass = ($script.Contains("deal CSV/date-quality gate") -and $script.Contains("Out-of-window CSV deals")) }
          )
          $failed = $false
          foreach ($check in $checks) {
            if ($check.Pass) { Write-Host ("PASS: " + $check.Name) }
            else { Write-Host ("FAIL: " + $check.Name); $failed = $true }
          }
          if ($failed) { throw "Stop060 safety validation failed." }
          Write-Host ("PASS: PowerShell parsed successfully ({0} tokens); no MT5 login or tester was launched." -f $tokens.Count)
