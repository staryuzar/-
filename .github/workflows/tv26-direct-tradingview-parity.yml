name: TV26 TradingView parity — display-only verification guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  display-only-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain the supported visual verification path
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Automated TradingView market-data processing is disabled

          This workflow intentionally does not export, download, upload, parse, compare, or process TradingView chart market data. TradingView's current policy licenses its chart data for display-only use and restricts non-display processing.

          For a compliant check, open trading-lab/tv26/TradingView_Visual_Parity_5TF.pine directly in TradingView and compare the visible closed-bar timestamp, OHLC, official TechnicalRating v3 summaries, and component votes against the MT5 chart/panel by eye. Align the instrument/feed and timestamps first. Do not export chart data to CSV or feed TradingView data into the EA or any automated signal pipeline.

          Source docs:
          - https://www.tradingview.com/policies/
          - https://www.tradingview.com/support/solutions/43000614331-technical-ratings/
          EOF
