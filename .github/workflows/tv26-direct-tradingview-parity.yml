name: TV26 direct TradingView parity

on:
  # As soon as the real TradingView CSV is committed, produce the comparison reports automatically.
  push:
    branches:
      - tv26-five-timeframes-arabic-candidate
    paths:
      - "trading-lab/tv26/parity-input/TV26_AllTF.csv"
  workflow_dispatch:
    inputs:
      mt5_audit_run_id:
        description: 'GitHub Actions run ID that contains the cloud MT5 audit artifact'
        required: true
        default: '40076997327'
        type: string
      mt5_utc_offset_hours:
        description: 'MT5 broker server offset from UTC, e.g. UTC+3 = 3'
        required: true
        default: '3'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MT5_AUDIT_RUN_ID: ${{ inputs.mt5_audit_run_id || '40076029579' }}
      MT5_UTC_OFFSET_HOURS: ${{ inputs.mt5_utc_offset_hours || '3' }}
    steps:
      - name: Checkout parity inputs
        uses: actions/checkout@v4
      - name: Download cloud MT5 audit artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloaded-mt5-audit
          gh run download "$MT5_AUDIT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "tv26-cloud-audit-$MT5_AUDIT_RUN_ID" --dir downloaded-mt5-audit
          audit_file="$(find downloaded-mt5-audit -name 'TV26_Audit_*.csv' -type f | head -n 1)"
          test -n "$audit_file"
          cp "$audit_file" trading-lab/tv26/parity-input/MT5_Audit.csv
      - name: Validate required TradingView exports
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          file="trading-lab/tv26/parity-input/TV26_AllTF.csv"
          if [[ ! -s "$file" ]]; then
            echo "::error title=Missing TradingView export::Upload the single TV26_AllTF.csv exported from TradingView_Parity_AllTF_Export.pine; see trading-lab/tv26/DIRECT_TRADINGVIEW_PARITY_GUIDE_AR.md."
            missing=1
          fi
          if [[ ! -s trading-lab/tv26/parity-input/MT5_Audit.csv ]]; then
            echo "::error title=Missing MT5 audit::The cloud MT5 audit artifact was not materialized."
            missing=1
          fi
          if [[ "$missing" != "0" ]]; then exit 2; fi
      - name: Compare component votes and summary ratings for all five timeframes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tv26-direct-parity-results
          overall_status=0
          for tf in M1 M5 M15 M30 H1; do
            echo "::group::Direct parity for ${tf}"
            if ! python trading-lab/tv26/split_tv26_alltf_export.py \
              --input trading-lab/tv26/parity-input/TV26_AllTF.csv \
              --timeframe "${tf}" \
              --output "tv26-direct-parity-results/TV26_${tf}_normalized.csv"; then
              echo "::error title=Export decode failed for ${tf}::Could not decode the TradingView export for this timeframe."
              overall_status=1
              echo "::endgroup::"
              continue
            fi
            if ! python trading-lab/tv26/compare_tv26_csv.py \
              --tv "tv26-direct-parity-results/TV26_${tf}_normalized.csv" \
              --mt5 trading-lab/tv26/parity-input/MT5_Audit.csv \
              --timeframe "${tf}" \
              --mt5-utc-offset-hours "$MT5_UTC_OFFSET_HOURS" \
              --min-bars 10 \
              --report "tv26-direct-parity-results/${tf}-report.md" \
              --details "tv26-direct-parity-results/${tf}-details.csv"; then
              echo "::error title=Parity failed for ${tf}::See the uploaded per-timeframe report and details CSV."
              overall_status=1
            fi
            echo "::endgroup::"
          done
          if [[ "${overall_status}" != "0" ]]; then
            echo "::error title=Overall parity failed::One or more timeframes did not pass; reports for all timeframes were generated."
            exit 1
          fi
      - name: Upload direct parity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv26-direct-tradingview-parity-${{ github.run_id }}
          path: tv26-direct-parity-results/
          if-no-files-found: warn
          retention-days: 30
