name: Mirsad Chart Observer — live MT5 account capture (read-only)

on:
  push:
    branches: [mirsad-mt5-demo]
    paths:
      - 'Mirsad_BTC/mt5/Mirsad_ChartObserver.mq5'
      - 'Mirsad_BTC/scripts/mirsad_mt5_observer_run.ps1'
      - '.github/workflows/mirsad-mt5-observer-demo.yml'
  workflow_dispatch:
    inputs:
      server:
        description: 'Exact MT5 broker server name (leave blank to use the server in the mt5 secret)'
        required: false
        default: ''
        type: string
      symbol:
        description: 'Exact MT5 broker symbol (for example BTCUSD, BTCUSDm or BTCUSDT)'
        required: false
        default: 'BTC'
        type: string
      timeframe:
        description: 'Chart timeframe to capture'
        required: false
        default: 'M1'
        type: choice
        options: [M1, M5, M15, M30, H1, H4, D1, W1]

permissions:
  contents: read

concurrency:
  group: mirsad-mt5-observer-demo
  cancel-in-progress: false

jobs:
  capture-mt5-chart:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout Mirsad project
        uses: actions/checkout@v4

      - name: Verify Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw 'MetaTrader 5 requires a Windows runner.' }
          Write-Output "Windows runner: $([System.Environment]::OSVersion.VersionString)"

      - name: Install, compile, log into configured MT5 account and capture chart using read-only Observer
        env:
          MT5_CREDENTIALS: ${{ secrets.mt5 }}
          MIRSAD_MT5_SERVER: ${{ inputs.server || '' }}
          MIRSAD_MT5_OBSERVER_SYMBOL: ${{ inputs.symbol || 'BTC' }}
          MIRSAD_MT5_OBSERVER_TIMEFRAME: ${{ inputs.timeframe || 'M1' }}
        shell: pwsh
        run: ./Mirsad_BTC/scripts/mirsad_mt5_observer_run.ps1

      - name: Upload sanitized MT5 Observer evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirsad-mt5-observer-live-demo-capture
          path: |
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/Mirsad_ChartObserver.ex5
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/Mirsad_ChartObserver_compile.log
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/observer-live-capture-summary.json
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/mirsad-observer-report.txt
          if-no-files-found: warn
          retention-days: 14
