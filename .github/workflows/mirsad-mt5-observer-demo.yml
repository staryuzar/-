name: Mirsad Chart Observer — any MT5 account capture (read-only)
# Diagnostics iteration: retry ChartScreenShot even when the hosted chart viewport is compact.
# Retry the Engine 2 smoke after restoring the PowerShell observer script syntax.
# Maximize the hosted MT5 chart before measuring its original viewport for Engine 2.
# Maximize the active MDI chart window, not just the terminal frame.
# Use asynchronous MDI maximize requests so the hosted terminal cannot block the Observer runner.
# Retry the exact Observer chart HWND and include safe Engine 2 OCR/reference calibration diagnostics.
# Re-run live Engine 2 native-OHLC cross-validation after fixing the OCR-success path.
# Retry with both MDI-wide and exact-BTC chart maximize, plus post-capture viewport readback.

on:
  push:
    # A workflow-only update triggers a new read-only observer capture using the latest Mirsad source branch.
    branches: [main]
    paths:
      - '.github/workflows/mirsad-mt5-observer-demo.yml'
  workflow_dispatch:
    inputs:
      server:
        description: 'MT5 broker server (defaults to the previously validated Headway demo endpoint; ignored when server is stored in the mt5 secret)'
        required: false
        default: 'mt5.demo.trade-hw.online'
        type: string
      symbol:
        description: 'Exact symbol name as shown by this broker'
        required: false
        default: 'BTC'
        type: string
      market_symbol:
        description: 'Corresponding Mirsad market-data symbol'
        required: false
        default: 'BTCUSDT'
        type: string
      timeframe:
        description: 'Any MT5 timeframe label, e.g. M1, M2, M3, M5, H1, H2, D1, MN1'
        required: false
        default: 'M1'
        type: string

permissions:
  contents: read

concurrency:
  group: mirsad-mt5-observer-demo
  cancel-in-progress: false

jobs:
  capture-mt5-chart:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout Mirsad project source branch
        uses: actions/checkout@v4
        with:
          ref: mirsad-mt5-demo

      - name: Verify Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw 'MetaTrader 5 requires a Windows runner.' }
          Write-Output "Windows runner: $([System.Environment]::OSVersion.VersionString)"

      - name: Set up Python for the read-only Engine 2 image check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Mirsad_BTC/requirements-chart.txt

      - name: Install chart-analysis dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check -r Mirsad_BTC/requirements-chart.txt

      # Retry after resolving the MQL chart HWND to its top-level MDI child.
      - name: Validate Observer PowerShell syntax before account access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'Mirsad_BTC\scripts\mirsad_mt5_observer_run.ps1'
          if (!(Test-Path -LiteralPath $scriptPath)) { throw 'Observer PowerShell runner script is missing.' }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List * | Out-String | Write-Output
            throw ("Observer PowerShell syntax validation failed with {0} parser errors." -f $parseErrors.Count)
          }
          Write-Output 'PASS — Observer PowerShell parser reported zero syntax errors.'

      - name: Connect to the configured MT5 account (demo or real), compile and capture using the read-only Observer
        env:
          MT5_CREDENTIALS: ${{ secrets.mt5 }}
          MIRSAD_MT5_SERVER: ${{ inputs.server || 'mt5.demo.trade-hw.online' }}
          MIRSAD_MT5_OBSERVER_SYMBOL: ${{ inputs.symbol || 'BTC' }}
          MIRSAD_MT5_MARKET_SYMBOL: ${{ inputs.market_symbol || 'BTCUSDT' }}
          MIRSAD_MT5_OBSERVER_TIMEFRAME: ${{ inputs.timeframe || 'M1' }}
        shell: pwsh
        run: ./Mirsad_BTC/scripts/mirsad_mt5_observer_run.ps1

      - name: Upload sanitized MT5 Observer evidence only (no account credentials, raw chart image or OHLC history)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirsad-mt5-observer-live-demo-capture
          path: |
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/Mirsad_ChartObserver.ex5
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/Mirsad_ChartObserver_compile.log
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/observer-live-capture-summary.json
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/observer-engine2-analysis.json
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/mirsad-observer-report.txt
          if-no-files-found: warn
          retention-days: 14
