name: Mirsad BTC - Held-out Crypto Chart Image Benchmark

on:
  push:
    branches: [mirsad-mt5-demo]
    paths:
      - 'Mirsad_BTC/mirsad/engines/chart.py'
      - 'Mirsad_BTC/scripts/crypto_dataset_chart_benchmark.py'
      - '.github/workflows/mirsad-crypto-dataset-chart-benchmark.yml'
  workflow_dispatch:
    inputs:
      ticker:
        description: Dataset ticker, or all
        required: true
        default: BTC-USD
        type: string
      max_images:
        description: 0 means every image in the selected held-out split
        required: true
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: mirsad-crypto-chart-benchmark
  cancel-in-progress: false

jobs:
  held-out-chart-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Mirsad branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Mirsad_BTC/requirements.txt

      - name: Install Mirsad chart-analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Mirsad_BTC/requirements.txt

      - name: Compile Mirsad chart engine
        run: python -m compileall -q Mirsad_BTC/mirsad

      - name: Test the full BTC held-out image split
        env:
          PYTHONPATH: Mirsad_BTC
        run: |
          python Mirsad_BTC/scripts/crypto_dataset_chart_benchmark.py \
            --split test \
            --ticker "${{ github.event.inputs.ticker || 'BTC-USD' }}" \
            --max-images "${{ github.event.inputs.max_images || '0' }}" \
            --workers 12 \
            --output mirsad-crypto-chart-benchmark.json

      - name: Upload per-image decisions and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirsad-held-out-crypto-chart-benchmark
          path: |
            mirsad-crypto-chart-benchmark.json
            mirsad-crypto-chart-benchmark-summary.md
          if-no-files-found: warn
          retention-days: 30
