name: Mirsad Engine 2 — Native OHLC Direction Analysis

on:
  push:
    branches: [mini]
    paths:
      - 'Mirsad_BTC/mirsad/engines/mt5_observer.py'
      - 'Mirsad_BTC/mirsad/engines/mt5_chart_candles.py'
      - 'Mirsad_BTC/mirsad/engines/mt5_native_indicators.py'
      - 'Mirsad_BTC/mirsad/engines/mt5_price_action.py'
      - 'Mirsad_BTC/mirsad/engines/chart_structure_knowledge.py'
      - 'Mirsad_BTC/mirsad/engines/chart_pattern_knowledge.py'
      - 'Mirsad_BTC/mirsad/engines/chart_classical_patterns.py'
      - 'Mirsad_BTC/mirsad/engines/chart_continuation_patterns.py'
      - 'Mirsad_BTC/mirsad/engines/indicators.py'
      - 'Mirsad_BTC/mirsad/engines/decision.py'
      - 'Mirsad_BTC/mirsad/engines/market_intelligence.py'
      - 'Mirsad_BTC/mirsad/runtime.py'
      - 'Mirsad_BTC/mirsad/health.py'
      - 'Mirsad_BTC/mirsad/engines/daily_risk.py'
      - 'Mirsad_BTC/dashboard.py'
      - 'Mirsad_BTC/tests/**'
      - 'Mirsad_BTC/requirements.txt'
      - '.github/workflows/mirsad-engine2-native-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirsad-engine2-native-analysis
  cancel-in-progress: false

jobs:
  native-analysis-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout mini branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Mirsad_BTC/requirements.txt

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Mirsad_BTC/requirements.txt

      - name: Compile Engine 2, runtime and live Observer validator
        run: |
          python -m compileall -q Mirsad_BTC/mirsad Mirsad_BTC/tests
          python -m py_compile Mirsad_BTC/dashboard.py
          python -m py_compile Mirsad_BTC/scripts/analyze_mt5_native_price_action.py

      - name: Run native OHLC price-action and separate Engine 3 indicator tests
        env:
          PYTHONPATH: Mirsad_BTC
        run: |
          # No image, screenshot, OCR or pixel-calibration work is part of the native live engine.
          # Native OHLC price-action and market structure.
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_mt5_price_action.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_mt5_chart_candles.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_engine2_public_btc_validation.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_mt5_native_indicators.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_chart_structure_knowledge.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_chart_pattern_knowledge.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_chart_classical_patterns.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_chart_continuation_patterns.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_chart_pattern_evaluation.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_chart_structure_evaluation.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_indicators.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_engine3_mt5_indicator_parity.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_runtime_observer_flow.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_dashboard_health.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_mt5_observer.py' -v
          # PyArrow fixture assertions pass, but the hosted runner aborts during
          # interpreter shutdown (exit 134); keep this external dataset adapter out
          # of the required Engine 2 gate until the upstream native shutdown issue is isolated.
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_daily_risk.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_engine_contracts.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_position_management.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_market_candle_timezones.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_market_intelligence.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_mt5_market.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_mt5_deal_ledger.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_position_ledger.py' -v
          python -m unittest discover -s Mirsad_BTC/tests -p 'test_run_structure_study.py' -v

      - name: Smoke-test Mirsad dashboard startup and health endpoint
        env:
          PYTHONPATH: Mirsad_BTC
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.request
          from pathlib import Path

          data_dir = Path(tempfile.mkdtemp(prefix="mirsad-dashboard-smoke-"))
          os.environ["MIRSAD_DATA_DIR"] = str(data_dir)
          from mirsad.health import build_component_health, summarize_component_health

          state = {
              "heartbeat_at_ms": int(time.time() * 1000),
              "overall_status": "PARTIAL_OR_WAITING",
              "engines": {},
              "market": {},
              "chart": {},
              "indicators": {},
              "engine_2_candles": {},
              "engine_2_multi_timeframe_structure": {},
              "engine_2_price_action": {},
              "mt5_native_indicators": {},
              "chart_observer": {},
              "bridge": {},
              "decision": {},
              "daily_risk": {"enabled": False, "mode": "DISABLED_FOR_DEVELOPMENT"},
              "command_publish": {"status": "NOT_READY"},
              "execution_controls": {"order_publish_enabled": False},
          }
          state["component_health"] = build_component_health(state)
          state["component_health_summary"] = summarize_component_health(state["component_health"])
          (data_dir / "system_status.json").write_text(json.dumps(state), encoding="utf-8")
          log_path = data_dir / "streamlit.log"
          env = os.environ.copy()
          app = Path("Mirsad_BTC/dashboard.py").resolve()
          process = None
          try:
              with log_path.open("w", encoding="utf-8") as log:
                  process = subprocess.Popen(
                      [sys.executable, "-m", "streamlit", "run", str(app),
                       "--server.address", "127.0.0.1", "--server.port", "8767",
                       "--server.headless", "true", "--browser.gatherUsageStats", "false"],
                      env=env, stdout=log, stderr=subprocess.STDOUT,
                  )
                  deadline = time.monotonic() + 35
                  healthy = False
                  while time.monotonic() < deadline and process.poll() is None:
                      try:
                          with urllib.request.urlopen("http://127.0.0.1:8767/_stcore/health", timeout=2) as response:
                              healthy = response.status == 200
                          if healthy:
                              with urllib.request.urlopen("http://127.0.0.1:8767/", timeout=3) as response:
                                  page = response.read(100_000).decode("utf-8", errors="replace").lower()
                                  healthy = response.status == 200 and ("streamlit" in page or "stapp" in page)
                          if healthy:
                              break
                      except Exception:
                          time.sleep(0.5)
                  if not healthy:
                      raise RuntimeError("Mirsad Streamlit dashboard did not become healthy.\\n" + log_path.read_text(encoding="utf-8", errors="replace")[-12000:])
                  print("PASS: Mirsad dashboard served its health endpoint and root page.")
          finally:
              if process is not None and process.poll() is None:
                  process.terminate()
                  try:
                      process.wait(timeout=8)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=5)
          PY

      - name: Upload safe test summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('engine2-native-analysis-test-summary.json').write_text(
              json.dumps({
                  'workflow': 'mirsad-engine2-native-analysis',
                  'test_scope': 'native MT5 candle patterns and price structure; Engine 3 indicators tested separately',
                  'decision_eligible': False,
                  'order_execution_enabled': False
              }, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Upload native-analysis test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirsad-engine2-native-analysis-test-summary
          path: engine2-native-analysis-test-summary.json
          if-no-files-found: warn
          retention-days: 14
