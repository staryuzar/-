name: Mirsad Chart Observer — actual MT5 read-only feed verification

on:
  push:
    branches: [mirsad-mt5-demo, mirsad-engine2-multicalibration]
    paths:
      - 'Mirsad_BTC/mt5/Mirsad_ChartObserver.mq5'
      - 'Mirsad_BTC/scripts/mirsad_mt5_observer_run.ps1'
      - 'Mirsad_BTC/scripts/analyze_mt5_observer_capture.py'
      - 'Mirsad_BTC/mirsad/engines/mt5_market.py'
      - 'Mirsad_BTC/mirsad/engines/mt5_chart_candles.py'
      - 'Mirsad_BTC/mirsad/engines/mt5_observer.py'
      - 'Mirsad_BTC/mirsad/engines/mt5_chart_pipeline.py'
      - 'Mirsad_BTC/mirsad/engines/chart.py'
      - 'Mirsad_BTC/mirsad/engines/chart_calibration.py'
      - 'Mirsad_BTC/mirsad/engines/chart_extraction.py'
      - 'Mirsad_BTC/mirsad/engines/chart_pattern_knowledge.py'
      - 'Mirsad_BTC/mirsad/engines/chart_structure_knowledge.py'
      - 'Mirsad_BTC/mirsad/engines/mt5_chart_geometry.py'
      - 'Mirsad_BTC/tests/**'
      - 'Mirsad_BTC/mirsad/runtime.py'
      - '.github/workflows/mirsad-chart-observer-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirsad-chart-observer-compile
  cancel-in-progress: false

jobs:
  actual-mt5-read-only-verification:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout Mirsad project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python for the real MT5 Engine 1/2 validators
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Mirsad_BTC/requirements.txt

      - name: Install Mirsad chart-analysis dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install -r Mirsad_BTC/requirements.txt

      - name: Run Engine 2 extraction, calibration, pattern and native-geometry tests
        shell: pwsh
        env:
          PYTHONPATH: Mirsad_BTC
        run: |
          $ErrorActionPreference = 'Stop'
          python -m compileall -q Mirsad_BTC/mirsad/engines Mirsad_BTC/scripts/analyze_mt5_observer_capture.py Mirsad_BTC/tests
          if ($LASTEXITCODE -ne 0) { throw 'Python compileall failed.' }
          python -m unittest Mirsad_BTC.tests.test_chart_multireference_calibration Mirsad_BTC.tests.test_chart_pattern_knowledge Mirsad_BTC.tests.test_mt5_chart_geometry -v
          if ($LASTEXITCODE -ne 0) { throw 'Engine 2 calibration/pattern/geometry tests failed.' }

      - name: Compile Observer, connect to actual MT5 demo and validate Engine 1 plus Engine 2
        env:
          MT5_CREDENTIALS: ${{ secrets.mt5 }}
          MIRSAD_MT5_SERVER: 'mt5.demo.trade-hw.online'
          MIRSAD_MT5_OBSERVER_SYMBOL: 'BTC'
          MIRSAD_MT5_OBSERVER_TIMEFRAME: 'M1'
          MIRSAD_MT5_MARKET_SYMBOL: 'BTCUSDT'
        shell: pwsh
        run: ./Mirsad_BTC/scripts/mirsad_mt5_observer_run.ps1

      - name: Upload sanitized actual MT5 evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirsad-actual-mt5-engine1-engine2-readonly
          path: |
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/Mirsad_ChartObserver.ex5
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/Mirsad_ChartObserver_compile.log
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/observer-live-capture-summary.json
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/observer-engine2-analysis.json
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/mirsad-observer-report.txt
          if-no-files-found: warn
          retention-days: 14
