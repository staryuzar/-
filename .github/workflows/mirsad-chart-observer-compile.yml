name: Mirsad Chart Observer — optional legacy visual diagnostic (manual only)

# Native OHLC, Engine 2 price action and Engine 3 parity are validated by
# mirsad-direct-feed-validation.yml. This older workflow requires PNG capture
# and is retained only for an explicitly requested visual-calibration study;
# it must never run as an automatic or required gate for the image-free design.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirsad-chart-observer-compile
  cancel-in-progress: false

jobs:
  actual-mt5-read-only-verification:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout Mirsad project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python for the real MT5 Engine 1/2 validators
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Mirsad_BTC/requirements.txt

      - name: Install Mirsad chart-analysis dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install -r Mirsad_BTC/requirements.txt

      - name: Compile Observer, connect to actual MT5 demo and validate Engine 1 plus Engine 2
        env:
          MT5_CREDENTIALS: ${{ secrets.mt5 }}
          MIRSAD_MT5_SERVER: 'mt5.demo.trade-hw.online'
          MIRSAD_MT5_OBSERVER_SYMBOL: 'BTC'
          MIRSAD_MT5_OBSERVER_TIMEFRAME: 'M1'
          MIRSAD_MT5_MARKET_SYMBOL: 'BTCUSDT'
        shell: pwsh
        run: ./Mirsad_BTC/scripts/mirsad_mt5_observer_run.ps1

      - name: Upload sanitized actual MT5 evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirsad-actual-mt5-engine1-engine2-readonly
          path: |
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/Mirsad_ChartObserver.ex5
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/Mirsad_ChartObserver_compile.log
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/observer-live-capture-summary.json
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/observer-engine2-analysis.json
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/observer-engine2-geometry-overlay.png
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/observer-engine3-indicator-parity.json
            ${{ runner.temp }}/mirsad-mt5-observer-check/evidence/mirsad-observer-report.txt
          if-no-files-found: warn
          retention-days: 14
