name: TV26 progressive daily-to-multi-day profit gate

on:
  push:
    branches:
      - tv26-five-timeframes-arabic-candidate
    paths:
      - ".github/workflows/tv26-one-day-conditional-extension.yml"
      - ".github/scripts/tv26_progressive_daily_gate.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv26-progressive-daily-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  progressive-test:
    name: Sequential 1-day, 2-day, 3-day... screening
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
      PYTHONUTF8: "1"
      TV26_TEST_MODEL: "4"
      TV26_TEST_RISK_PERCENT: "1.00"
      TV26_TEST_STOP_ATR: "2.00"
      TV26_TEST_TARGET_ATR: "4.00"
      TV26_TEST_REQUIRE_M1_BREAKOUT: "true"

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formula-audit dependencies
        run: python -m pip install -r trading-lab/tv26/requirements-formula-audit.txt

      - name: Progressive sequential tester
        shell: pwsh
        run: ./.github/scripts/tv26_progressive_daily_gate.ps1

      - name: Upload every completed stage and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv26-progressive-daily-gate-${{ github.run_id }}
          path: tv26-progressive-results/
          if-no-files-found: warn
          retention-days: 30
