name: TV26 M1/M5 oscillator gate holdout — Sep 21–30

on:
  push:
    branches:
      - tv26-m1m5-oscillator-gate-study
    paths:
      - ".github/workflows/tv26-m1m5-oscillator-holdout-sep21-30.yml"
      - ".github/scripts/tv26_strategy_cooldown_backtest.ps1"
      - "trading-lab/tv26/TV26_FiveTF_Arabic_CANDIDATE.mq5"
      - "trading-lab/tv26/tests/test_m1m5_oscillator_gate.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv26-m1m5-oscillator-holdout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tester:
    name: "Sep 21–30 — minimum M1/M5 oscillator ${{ matrix.min_osc }}"
    runs-on: windows-2022
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        min_osc: ["0.00", "0.15"]

    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
      PYTHONUTF8: "1"
      TV26_TEST_FROM: "2026.09.21"
      TV26_TEST_TO: "2026.10.01"
      TV26_TEST_MODEL: "4"
      TV26_TEST_RISK_PERCENT: "1.00"
      TV26_TEST_STOP_ATR: "2.00"
      TV26_TEST_TARGET_ATR: "3.00"
      TV26_TEST_REQUIRE_M1_CLOSE_BREAKOUT: "true"
      TV26_TEST_COOLDOWN_BARS: "0"
      TV26_TEST_MIN_M1M5_OSCILLATOR_RATING: "${{ matrix.min_osc }}"

    steps:
      - name: Checkout oscillator-gate research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formula-audit dependencies
        run: python -m pip install -r trading-lab/tv26/requirements-formula-audit.txt

      - name: Run oscillator-gate and regression contracts
        shell: bash
        run: python -m unittest discover -s trading-lab/tv26/tests -p "test_*.py"

      - name: Run isolated MT5 Strategy Tester with bounded tick-history retry
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $originalSecret = [string]$env:MT5_CREDENTIALS
          $scriptPath = ".\\.github\\scripts\\tv26_strategy_cooldown_backtest.ps1"
          $results = Join-Path $PWD "tv26-strategy-results"
          $completed = $false

          for ($attempt = 1; $attempt -le 2; $attempt++) {
            $env:MT5_CREDENTIALS = $originalSecret
            try {
              & $scriptPath
              $completed = $true
              break
            } catch {
              $diagDir = Join-Path $results "diagnostics"
              $transientTickFailure = $false
              if (Test-Path -LiteralPath $diagDir) {
                foreach ($logFile in @(Get-ChildItem -LiteralPath $diagDir -Filter "*.txt" -File -ErrorAction SilentlyContinue)) {
                  $logText = Get-Content -LiteralPath $logFile.FullName -Raw -ErrorAction SilentlyContinue
                  if ($logText -match "(?i)no history data, stop testing|preliminary downloading of history ticks canceled") {
                    $transientTickFailure = $true
                    break
                  }
                }
              }
              if ($attempt -ge 2 -or !$transientTickFailure) { throw }
              Write-Warning "MT5 reported an explicitly incomplete tick-history download. Preserve diagnostics and retry once in this runner."
              $failedDiag = Join-Path $results "retry-attempt-1-diagnostics"
              if (Test-Path -LiteralPath $failedDiag) { Remove-Item -LiteralPath $failedDiag -Recurse -Force }
              if (Test-Path -LiteralPath $diagDir) { Move-Item -LiteralPath $diagDir -Destination $failedDiag -Force }
              $summaryPath = Join-Path $results "strategy-backtest-summary.txt"
              if (Test-Path -LiteralPath $summaryPath) {
                Copy-Item -LiteralPath $summaryPath -Destination (Join-Path $results "retry-attempt-1-summary.txt") -Force
              }
              foreach ($fileName in @(
                "TV26_Audit_XAUUSD_26102327.csv",
                "TV26_OHLC_History_XAUUSD.csv",
                "strategy-tester-report.html",
                "data-integrity-report.md",
                "data-integrity-report.json",
                "formula-parity-report.md",
                "formula-parity-report.json",
                "formula-parity-details.csv"
              )) {
                $filePath = Join-Path $results $fileName
                if (Test-Path -LiteralPath $filePath) { Remove-Item -LiteralPath $filePath -Force }
              }
              $eventLogs = Join-Path $results "diagnostic-logs"
              if (Test-Path -LiteralPath $eventLogs) { Remove-Item -LiteralPath $eventLogs -Recurse -Force }
              Start-Sleep -Seconds 3
            }
          }
          $env:MT5_CREDENTIALS = $null
          if (!$completed) { throw "MT5 Strategy Tester did not complete after the permitted tick-history retry." }

      - name: Validate exported audit integrity
        shell: bash
        run: >-
          python trading-lab/tv26/validate_tv26_mt5_audit.py
          --csv tv26-strategy-results/TV26_Audit_XAUUSD_26102327.csv
          --report tv26-strategy-results/data-integrity-report.md
          --json tv26-strategy-results/data-integrity-report.json

      - name: Compare all component votes against reference formulas
        shell: bash
        run: >-
          python trading-lab/tv26/reference_tv26_formulas.py
          --audit tv26-strategy-results/TV26_Audit_XAUUSD_26102327.csv
          --history tv26-strategy-results/TV26_OHLC_History_XAUUSD.csv
          --report tv26-strategy-results/formula-parity-report.md
          --details tv26-strategy-results/formula-parity-details.csv
          --json tv26-strategy-results/formula-parity-report.json

      - name: Add metrics to the run summary
        if: always()
        shell: pwsh
        run: |
          "## Sep 21–30 — M1/M5 directional oscillator threshold ${{ matrix.min_osc }}" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          "Strategy-only filter; the official five-timeframe TechnicalRating classification is unchanged. All orders remain tester-only." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $summaryPath = "tv26-strategy-results/strategy-backtest-summary.txt"
          if (Test-Path -LiteralPath $summaryPath) {
            Get-Content -LiteralPath $summaryPath | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          } else {
            "Tester summary missing; this arm is an incomplete infrastructure run, not a strategy outcome." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }

      - name: Upload full tester evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv26-m1m5-oscillator-sep21-30-${{ matrix.min_osc }}-${{ github.run_id }}
          path: tv26-strategy-results/
          if-no-files-found: warn
          retention-days: 30
