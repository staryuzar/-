name: Mirsad BTC Image 20 Pilot

on:
  push:
    branches:
      - mirsad-mt5-demo
      - mirsad-engine2-native-analysis
    paths:
      - ".github/workflows/mirsad-btc-image-pilot.yml"
      - "Mirsad_BTC/scripts/run_hf_btc_chart_image_benchmark.py"
      - "Mirsad_BTC/tests/test_hf_btc_chart_image_benchmark.py"
      - "Mirsad_BTC/mirsad/engines/chart.py"
      - "Mirsad_BTC/mirsad/engines/chart_pixel_metrics.py"
      - "Mirsad_BTC/tests/test_chart_pixel_metrics.py"
      - "Mirsad_BTC/mirsad/engines/chart_calibration.py"
      - "Mirsad_BTC/mirsad/engines/chart_extraction.py"
      - "Mirsad_BTC/tests/test_chart_engine.py"
      - "Mirsad_BTC/tests/test_chart_extraction.py"

permissions:
  contents: read

concurrency:
  group: mirsad-btc-image-20-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  btc-image-pilot:
    name: Run Engine 2 on 20 BTC chart images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Mirsad_BTC
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=2.0,<3" "opencv-python-headless>=4.10,<5" "Pillow>=10,<13" "rapidocr>=3.10,<4" "onnxruntime>=1.20,<2" "TA-Lib==0.8.3" "datasets>=3,<5"

      - name: Test pilot benchmark helpers
        run: python -m unittest discover -s tests -p "test_hf_btc_chart_image_benchmark.py" -v

      - name: Run Engine 2 on exactly 20 BTC images
        run: python scripts/run_hf_btc_chart_image_benchmark.py --max-images 20 --min-images 20 --ocr-sample-limit 5 --output reports/hf_btc_chart_image_pilot_20.json

      - name: Run the full independent BTC image dataset (minimum 10,000; target 13,081)
        run: python scripts/run_hf_btc_chart_image_benchmark.py --max-images 13081 --min-images 10000 --ocr-sample-limit 128 --output reports/hf_btc_chart_image_full.json

      - name: Upload pilot and full-dataset reports
        uses: actions/upload-artifact@v4
        with:
          name: mirsad-btc-image-pilot-and-full-${{ github.run_id }}
          path: |
            Mirsad_BTC/reports/hf_btc_chart_image_pilot_20.json
            Mirsad_BTC/reports/hf_btc_chart_image_full.json
          if-no-files-found: error
          retention-days: 30
