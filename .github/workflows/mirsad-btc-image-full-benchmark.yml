name: Mirsad BTC — Full 10k+ chart image benchmark (manual approval)

on:
  workflow_dispatch:
    inputs:
      max_images:
        description: Maximum number of BTC chart images to process (dataset target is 13,081)
        required: true
        default: 13081
        type: number
      min_images:
        description: Minimum number of images required for a valid run
        required: true
        default: 10000
        type: number
      ocr_sample_limit:
        description: Number of images sampled for OCR diagnostics
        required: true
        default: 128
        type: number

permissions:
  contents: read

concurrency:
  group: mirsad-btc-image-full-benchmark
  cancel-in-progress: false

jobs:
  full-btc-image-benchmark:
    name: Run the approved BTC chart-image dataset
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Mirsad_BTC
    steps:
      - name: Check out the main project
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=2.0,<3" "opencv-python-headless>=4.10,<5" "Pillow>=10,<13" "rapidocr>=3.10,<4" "onnxruntime>=1.20,<2" "TA-Lib==0.8.3" "datasets>=3,<5"

      - name: Test benchmark helpers
        run: python -m unittest discover -s tests -p "test_hf_btc_chart_image_benchmark.py" -v

      - name: Run the selected BTC image dataset
        env:
          MAX_IMAGES: ${{ inputs.max_images }}
          MIN_IMAGES: ${{ inputs.min_images }}
          OCR_SAMPLE_LIMIT: ${{ inputs.ocr_sample_limit }}
        run: |
          python scripts/run_hf_btc_chart_image_benchmark.py \
            --max-images "$MAX_IMAGES" \
            --min-images "$MIN_IMAGES" \
            --ocr-sample-limit "$OCR_SAMPLE_LIMIT" \
            --output reports/hf_btc_chart_image_full.json

      - name: Upload full-dataset report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirsad-btc-image-full-${{ github.run_id }}
          path: Mirsad_BTC/reports/hf_btc_chart_image_full.json
          if-no-files-found: warn
          retention-days: 30
