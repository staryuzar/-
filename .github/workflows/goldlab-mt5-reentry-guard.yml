name: GoldLab MT5 Fresh-Signal Re-entry Guard Diagnostic

on:
  push:
    branches: [goldlab-reentry-guard-candidate]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/scripts/goldlab_adx25_min23_shortonly_reentry_guard.ps1"
      - ".github/workflows/goldlab-mt5-reentry-guard.yml"
  pull_request:
    branches: [main]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/scripts/goldlab_adx25_min23_shortonly_reentry_guard.ps1"
      - ".github/workflows/goldlab-mt5-reentry-guard.yml"

permissions:
  contents: read

concurrency:
  group: goldlab-mt5-reentry-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reentry-guard-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
    steps:
      - name: Checkout isolated GoldLab re-entry-guard candidate
        uses: actions/checkout@v4

      - name: Run matched-period XAUUSD Model=4 re-entry-guard diagnostic
        shell: pwsh
        run: |
          .github/scripts/goldlab_adx25_min23_shortonly_reentry_guard.ps1

      - name: Upload full MT5 evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldlab-mt5-reentry-guard-${{ github.run_id }}
          path: goldlab-results/
          if-no-files-found: warn
          retention-days: 90
