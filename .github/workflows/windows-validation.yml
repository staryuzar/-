name: Aurora Windows validation

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source tree for validation
        shell: pwsh
        run: |
          $archive = Join-Path $PWD "Aurora_Control_Room_v2_4_0_FIRST_RUN_READY_AR.zip"
          New-Item -ItemType Directory -Path "ci_source" -Force | Out-Null
          if (Test-Path $archive) {
            Expand-Archive -LiteralPath $archive -DestinationPath "ci_source" -Force
            Write-Host "Extracted uploaded Aurora ZIP into ci_source"
          } elseif (Test-Path (Join-Path $PWD "requirements.txt")) {
            Get-ChildItem -Force | Where-Object { $_.Name -notin @(".git", "ci_source") } | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination "ci_source" -Recurse -Force
            }
            Write-Host "Copied unpacked Aurora source tree into ci_source"
          } else {
            throw "Neither Aurora ZIP nor unpacked requirements.txt source tree was found."
          }
          if (!(Test-Path "ci_source\requirements.txt")) { throw "requirements.txt not found in prepared source" }

      - name: Audit original package before any compatibility edits
        if: hashFiles('Aurora_Control_Room_v2_4_0_FIRST_RUN_READY_AR.zip') != ''
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Join-Path $PWD "Aurora_Control_Room_v2_4_0_FIRST_RUN_READY_AR.zip"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entries = @($zip.Entries | Where-Object { $_.Name -ne "" })
            $lines = @(
              "# Original package audit",
              "",
              "- Archive: Aurora_Control_Room_v2_4_0_FIRST_RUN_READY_AR.zip",
              "- SHA-256: $hash",
              "- File entries: $($entries.Count)",
              "- Total uncompressed bytes: $(($entries | Measure-Object -Property Length -Sum).Sum)",
              "",
              "## Required files",
              ""
            )
            foreach ($required in @("requirements.txt", "START_WINDOWS.bat", "RUN_TESTS_WINDOWS.bat", "DIAGNOSE_WINDOWS.bat")) {
              $entry = $entries | Where-Object { $_.FullName -eq $required -or $_.FullName.EndsWith("/$required") } | Select-Object -First 1
              if ($null -eq $entry) {
                $lines += "- FAIL — $required not found"
                continue
              }
              $stream = $entry.Open()
              try {
                $bytes = New-Object byte[] 3
                $read = $stream.Read($bytes, 0, 3)
              } finally { $stream.Dispose() }
              $hasBom = $read -eq 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
              if ($required.EndsWith(".bat") -and $hasBom) {
                $lines += "- WARN — ${required}: UTF-8 BOM present in ORIGINAL archive (the later test compatibility step may remove it)"
              } else {
                $lines += "- PASS — $required exists; BOM=$hasBom"
              }
            }
            $lines += @("", "## Archive entries", "")
            $lines += $entries | ForEach-Object { "- $($_.FullName) ($($_.Length) bytes)" }
            $lines | Set-Content -LiteralPath (Join-Path $PWD "ci_archive_audit.md") -Encoding utf8
            Write-Host ($lines -join "`n")
          } finally { $zip.Dispose() }

      - name: Preserve pristine extracted source for review
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: pristine-source-py3.11
          path: ci_source/**
          include-hidden-files: true
          if-no-files-found: error

      - name: Prepare release source and apply reviewed fixes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release_source" -Force | Out-Null
          Get-ChildItem -LiteralPath "ci_source" -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination "release_source" -Recurse -Force
          }
          python .github/scripts/ci_prepare_release.py ci_source
          python .github/scripts/ci_prepare_release.py release_source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ci_source/requirements.txt

      - name: Install dependencies
        shell: pwsh
        working-directory: ci_source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Confirm real Windows runtime and desktop imports
        shell: pwsh
        working-directory: ci_source
        run: |
          python -c "import os, sys; print('Python:', sys.version); print('OS:', os.name); assert os.name == 'nt', 'Expected Windows runner'"
          python -c "import pywinauto, pyautogui, pyperclip; print('Windows GUI libraries import successfully')"

      - name: Normalize Windows-only test assumptions in legacy ZIP
        shell: pwsh
        run: |
          python .github/scripts/ci_windows_test_compat.py ci_source
          python .github/scripts/ci_windows_test_compat.py release_source

      - name: Compile Python files
        shell: pwsh
        working-directory: ci_source
        run: python -m compileall -q .

      - name: Run automated test suite
        shell: pwsh
        working-directory: ci_source
        run: python -m pytest -q --junitxml=windows-test-results.xml

      - name: Smoke-test Streamlit chat room startup
        if: matrix.python-version == '3.11'
        shell: pwsh
        working-directory: ci_source
        run: |
          $stdout = Join-Path $PWD "streamlit-smoke.stdout.log"
          $stderr = Join-Path $PWD "streamlit-smoke.stderr.log"
          $server = Start-Process -FilePath python -ArgumentList @("-m", "streamlit", "run", "app.py", "--server.port", "8765", "--server.headless", "true", "--browser.gatherUsageStats", "false") -WorkingDirectory $PWD -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              $server.Refresh()
              if ($server.HasExited) { break }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8765/_stcore/health" -TimeoutSec 2 -UseBasicParsing
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (!$healthy) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "Streamlit health endpoint did not return HTTP 200."
            }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -TimeoutSec 10 -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "streamlit|stApp") { throw "Streamlit root page did not return the expected app shell." }
            Write-Host "PASS: Streamlit health endpoint and chat room root page returned HTTP 200."
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Verify batch files have no UTF-8 BOM
        shell: pwsh
        working-directory: ci_source
        run: |
          $files = @('START_WINDOWS.bat', 'RUN_TESTS_WINDOWS.bat', 'DIAGNOSE_WINDOWS.bat')
          foreach ($file in $files) {
            $path = Join-Path $PWD $file
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "$file starts with a UTF-8 BOM"
            }
            Write-Host "$file BOM check passed"
          }

      - name: Build patched release package
        if: matrix.python-version == '3.11'
        shell: pwsh
        run: python .github/scripts/ci_prepare_release.py release_source --build-zip Aurora_Control_Room_v2_4_0_PATCHED_AR.zip

      - name: Upload patched release package
        if: matrix.python-version == '3.11' && success()
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Control-Room-v2.4.0-patched
          path: Aurora_Control_Room_v2_4_0_PATCHED_AR.zip
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results-py${{ matrix.python-version }}
          path: ci_source/windows-test-results.xml
          if-no-files-found: warn

      - name: Upload Streamlit startup logs
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-startup-smoke-logs
          path: ci_source/streamlit-smoke.*.log
          if-no-files-found: warn

      - name: Upload original package audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-package-audit-py${{ matrix.python-version }}
          path: ci_archive_audit.md
          if-no-files-found: ignore

  live-browser-smoke:
    name: Live Chrome / local test website
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract assistant source for integration test
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "Aurora_Control_Room_v2_4_0_FIRST_RUN_READY_AR.zip" -DestinationPath "ci_browser_source" -Force
          if (!(Test-Path "ci_browser_source/browser_control.py")) { throw "browser_control.py missing from source package" }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Selenium
        shell: pwsh
        run: python -m pip install --upgrade pip selenium
      - name: Exercise real Chrome against a disposable test website
        shell: pwsh
        run: |
          python .github/scripts/live_browser_smoke.py 2>&1 | Tee-Object -FilePath browser-smoke-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload browser smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-smoke-report
          path: browser-smoke-report.txt
          if-no-files-found: warn

  mt5-install-smoke:
    name: MetaTrader 5 install / assistant launch integration
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract assistant source for MT5 integration test
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "Aurora_Control_Room_v2_4_0_FIRST_RUN_READY_AR.zip" -DestinationPath "ci_mt5_source" -Force
          if (!(Test-Path "ci_mt5_source/windows_tools.py")) { throw "windows_tools.py missing from source package" }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Windows automation dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip pywinauto pyautogui pyperclip
      - name: Download, install, launch, and authenticate Headway demo MT5
        env:
          MT5_CREDENTIALS: ${{ secrets.mt5 }}
        shell: pwsh
        run: ./.github/scripts/mt5_install_smoke.ps1
      - name: Upload MetaTrader smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metatrader5-install-smoke-report
          path: ${{ runner.temp }}/aurora-mt5-smoke/logs/**
          if-no-files-found: warn
