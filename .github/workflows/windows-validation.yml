name: Aurora Windows validation

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".github/PROJECT_STATE_AR.md"
      - ".github/RESUME_REPORT_2026-10-19_AR.md"
      - "PROJECT_RESUME_AR_2026-10-21.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".github/PROJECT_STATE_AR.md"
      - ".github/RESUME_REPORT_2026-10-19_AR.md"
      - "PROJECT_RESUME_AR_2026-10-21.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-windows-validation-${{ github.ref }}
  # Report-only changes are filtered above; keep an active MT5 login check alive.
  cancel-in-progress: false

jobs:
  scope-check:
    name: Decide whether full Windows validation is needed
    runs-on: ubuntu-latest
    outputs:
      run_validation: ${{ steps.scope.outputs.run_validation }}
      scope_reason: ${{ steps.scope.outputs.scope_reason }}
      run_live_e2e: ${{ steps.scope.outputs.run_live_e2e }}
    steps:
      - name: Checkout the exact commit under review
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check files changed in the latest commit
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # The paid/live provider test runs once only when the latest PR commit explicitly opts in.
          echo "run_live_e2e=false" >> "$GITHUB_OUTPUT"
          # Bitcoin Intelligence Lab is an independent, read-only project.
          # Its PR updates must never invoke Aurora's unrelated Windows/MT5 jobs.
          if [[ "${GITHUB_HEAD_REF:-}" == "bitcoin-intelligence-lab" || "${GITHUB_REF_NAME:-}" == "bitcoin-intelligence-lab" ]]; then
            echo "run_validation=false" >> "$GITHUB_OUTPUT"
            echo "scope_reason=independent_bitcoin_intelligence_lab" >> "$GITHUB_OUTPUT"
            echo "Standalone Bitcoin Intelligence Lab branch: skip Aurora Windows, browser, and MT5 validation."
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            subject="$(git log -1 --format=%s)"
            if [[ "$subject" == *"[run-live-assistant-e2e]"* ]]; then
              echo "run_live_e2e=true" >> "$GITHUB_OUTPUT"
              echo "Explicit marker commit: one live assistant E2E is enabled."
            fi
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_validation=true" >> "$GITHUB_OUTPUT"
            echo "scope_reason=manual_full_validation" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: full validation is required."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              echo "run_validation=true" >> "$GITHUB_OUTPUT"
              echo "scope_reason=initial_push" >> "$GITHUB_OUTPUT"
              echo "No usable before-SHA; fail open to full validation."
              exit 0
            fi
            changed="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          else
            if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              echo "run_validation=true" >> "$GITHUB_OUTPUT"
              echo "scope_reason=no_parent_commit" >> "$GITHUB_OUTPUT"
              echo "No parent commit found; fail open to full validation."
              exit 0
            fi
            changed="$(git diff --name-only HEAD^ HEAD)"
          fi

          printf 'Files changed in validation scope:\n%s\n' "$changed"
          run_full=false
          reason=documentation_only
          if [[ -z "$changed" ]]; then
            run_full=true
            reason=empty_change_list_fail_open
          else
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                README.md|.github/PROJECT_STATE_AR.md|.github/RESUME_REPORT_2026-10-19_AR.md|PROJECT_RESUME_AR_2026-10-21.md)
                  ;;
                *)
                  run_full=true
                  reason=code_or_workflow_changed
                  break
                  ;;
              esac
            done <<< "$changed"
          fi
          echo "run_validation=$run_full" >> "$GITHUB_OUTPUT"
          echo "scope_reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Scope decision: $run_full ($reason)."

  windows-tests:
    needs: scope-check
    if: needs.scope-check.outputs.run_validation == 'true'
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source tree for validation
        shell: pwsh
        run: |
          $archive = Join-Path $PWD "Aurora_Control_Room_v2_4_0_FIRST_RUN_READY_AR.zip"
          New-Item -ItemType Directory -Path "ci_source" -Force | Out-Null
          if (Test-Path $archive) {
            Expand-Archive -LiteralPath $archive -DestinationPath "ci_source" -Force
            Write-Host "Extracted uploaded Aurora ZIP into ci_source"
          } elseif (Test-Path (Join-Path $PWD "requirements.txt")) {
            Get-ChildItem -Force | Where-Object { $_.Name -notin @(".git", "ci_source") } | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination "ci_source" -Recurse -Force
            }
            Write-Host "Copied unpacked Aurora source tree into ci_source"
          } else {
            throw "Neither Aurora ZIP nor unpacked requirements.txt source tree was found."
          }
          if (!(Test-Path "ci_source\requirements.txt")) { throw "requirements.txt not found in prepared source" }

      - name: Audit original package before any compatibility edits
        if: hashFiles('Aurora_Control_Room_v2_4_0_FIRST_RUN_READY_AR.zip') != ''
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Join-Path $PWD "Aurora_Control_Room_v2_4_0_FIRST_RUN_READY_AR.zip"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entries = @($zip.Entries | Where-Object { $_.Name -ne "" })
            $lines = @(
              "# Original package audit",
              "",
              "- Archive: Aurora_Control_Room_v2_4_0_FIRST_RUN_READY_AR.zip",
              "- SHA-256: $hash",
              "- File entries: $($entries.Count)",
              "- Total uncompressed bytes: $(($entries | Measure-Object -Property Length -Sum).Sum)",
              "",
              "## Required files",
              ""
            )
            foreach ($required in @("requirements.txt", "START_WINDOWS.bat", "RUN_TESTS_WINDOWS.bat", "DIAGNOSE_WINDOWS.bat")) {
              $entry = $entries | Where-Object { $_.FullName -eq $required -or $_.FullName.EndsWith("/$required") } | Select-Object -First 1
              if ($null -eq $entry) {
                $lines += "- FAIL — $required not found"
                continue
              }
              $stream = $entry.Open()
              try {
                $bytes = New-Object byte[] 3
                $read = $stream.Read($bytes, 0, 3)
              } finally { $stream.Dispose() }
              $hasBom = $read -eq 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
              if ($required.EndsWith(".bat") -and $hasBom) {
                $lines += "- WARN — ${required}: UTF-8 BOM present in ORIGINAL archive (the later test compatibility step may remove it)"
              } else {
                $lines += "- PASS — $required exists; BOM=$hasBom"
              }
            }
            $lines += @("", "## Archive entries", "")
            $lines += $entries | ForEach-Object { "- $($_.FullName) ($($_.Length) bytes)" }
            $lines | Set-Content -LiteralPath (Join-Path $PWD "ci_archive_audit.md") -Encoding utf8
            Write-Host ($lines -join "`n")
          } finally { $zip.Dispose() }

      - name: Preserve pristine extracted source for review
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: pristine-source-py3.11
          path: ci_source/**
          include-hidden-files: true
          if-no-files-found: error

      - name: Prepare release source and apply reviewed fixes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release_source" -Force | Out-Null
          Get-ChildItem -LiteralPath "ci_source" -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination "release_source" -Recurse -Force
          }
          python .github/scripts/ci_prepare_release.py ci_source
          python .github/scripts/ci_prepare_release.py release_source
          python .github/scripts/ci_enrich_knowledge.py release_source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ci_source/requirements.txt

      - name: Install dependencies
        shell: pwsh
        working-directory: ci_source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Confirm real Windows runtime and desktop imports
        shell: pwsh
        working-directory: ci_source
        run: |
          python -c "import os, sys; print('Python:', sys.version); print('OS:', os.name); assert os.name == 'nt', 'Expected Windows runner'"
          python -c "import pywinauto, pyautogui, pyperclip; print('Windows GUI libraries import successfully')"

      - name: Normalize Windows-only test assumptions in legacy ZIP
        shell: pwsh
        run: |
          python .github/scripts/ci_windows_test_compat.py ci_source
          python .github/scripts/ci_windows_test_compat.py release_source

      - name: Compile Python files
        shell: pwsh
        working-directory: ci_source
        run: python -m compileall -q .

      - name: Run automated test suite
        shell: pwsh
        working-directory: ci_source
        run: python -m pytest -q --junitxml=windows-test-results.xml

      - name: Test bundled MT5 and Chrome skill pack
        shell: pwsh
        working-directory: release_source
        run: python -m pytest -q tests/test_aurora_skill_pack.py

      - name: Test independent real-assistant E2E evidence contract
        shell: pwsh
        run: python .github/scripts/test_assistant_e2e_contract.py

      - name: Test provider API preflight without a generation request
        shell: pwsh
        run: python .github/scripts/test_provider_api_preflight.py

      - name: Smoke-test Streamlit chat room startup
        if: matrix.python-version == '3.11'
        shell: pwsh
        working-directory: ci_source
        run: |
          $stdout = Join-Path $PWD "streamlit-smoke.stdout.log"
          $stderr = Join-Path $PWD "streamlit-smoke.stderr.log"
          $server = Start-Process -FilePath python -ArgumentList @("-m", "streamlit", "run", "app.py", "--server.port", "8765", "--server.headless", "true", "--browser.gatherUsageStats", "false") -WorkingDirectory $PWD -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              $server.Refresh()
              if ($server.HasExited) { break }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8765/_stcore/health" -TimeoutSec 2 -UseBasicParsing
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (!$healthy) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "Streamlit health endpoint did not return HTTP 200."
            }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -TimeoutSec 10 -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "streamlit|stApp") { throw "Streamlit root page did not return the expected app shell." }
            Write-Host "PASS: Streamlit health endpoint and chat room root page returned HTTP 200."
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Verify batch files have no UTF-8 BOM
        shell: pwsh
        working-directory: ci_source
        run: |
          $files = @('START_WINDOWS.bat', 'RUN_TESTS_WINDOWS.bat', 'DIAGNOSE_WINDOWS.bat')
          foreach ($file in $files) {
            $path = Join-Path $PWD $file
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "$file starts with a UTF-8 BOM"
            }
            Write-Host "$file BOM check passed"
          }

      - name: Test release archive hygiene
        shell: pwsh
        run: python .github/scripts/test_ci_prepare_release.py -v

      - name: Build patched release package
        if: matrix.python-version == '3.11'
        shell: pwsh
        run: python .github/scripts/ci_prepare_release.py release_source --build-zip Aurora_Control_Room_v2_4_0_PATCHED_AR.zip

      - name: Upload patched release package
        if: matrix.python-version == '3.11' && success()
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Control-Room-v2.4.0-patched
          path: Aurora_Control_Room_v2_4_0_PATCHED_AR.zip
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results-py${{ matrix.python-version }}
          path: ci_source/windows-test-results.xml
          if-no-files-found: warn

      - name: Upload Streamlit startup logs
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-startup-smoke-logs
          path: ci_source/streamlit-smoke.*.log
          if-no-files-found: warn

      - name: Upload original package audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-package-audit-py${{ matrix.python-version }}
          path: ci_archive_audit.md
          if-no-files-found: ignore

  live-assistant-browser-e2e:
    needs: scope-check
    if: needs.scope-check.outputs.run_validation == 'true' && needs.scope-check.outputs.run_live_e2e == 'true'
    name: Live Gemini -> Chrome -> assistant answer
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract clean assistant source
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "Aurora_Control_Room_v2_4_0_FIRST_RUN_READY_AR.zip" -DestinationPath "ci_live_e2e_source" -Force
          if (!(Test-Path "ci_live_e2e_source/app.py")) { throw "app.py missing from clean source archive" }

      - name: Apply reviewed fixes and a bounded E2E-only tool-round cap
        shell: pwsh
        run: |
          python .github/scripts/ci_prepare_release.py ci_live_e2e_source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/ci_enrich_knowledge.py ci_live_e2e_source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Join-Path $PWD "ci_live_e2e_source\app.py"
          $source = [System.IO.File]::ReadAllText($app, [System.Text.Encoding]::UTF8)
          $original = 'MAX_TOOL_ROUNDS = 1000  # High emergency ceiling; normal tasks finish when the model returns a final answer.'
          if (!$source.Contains($original)) { throw "Could not locate the expected tool-round ceiling; refusing a fuzzy test patch." }
          $source = $source.Replace($original, 'MAX_TOOL_ROUNDS = 4  # Temporary E2E-only safety cap.')
          [System.IO.File]::WriteAllText($app, $source, [System.Text.UTF8Encoding]::new($false))

      - name: Install assistant dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r ci_live_e2e_source/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute one live read-only assistant task
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.8-flash
          AURORA_LIVE_E2E_TIMEOUT_SECONDS: "210"
        shell: pwsh
        run: |
          python -m py_compile .github/scripts/live_assistant_browser_e2e.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/live_assistant_browser_e2e.py 2>&1 | Tee-Object -FilePath live-assistant-browser-e2e-console.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "live-assistant-browser-e2e-report.txt")) { throw "Live E2E returned without creating its required evidence report." }
          if (!(Test-Path "live-assistant-browser-e2e-console.txt")) { throw "Live E2E console evidence was not created." }

      - name: Upload sanitized live E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-assistant-browser-e2e-report
          path: |
            live-assistant-browser-e2e-report.txt
            live-assistant-browser-e2e-console.txt
          if-no-files-found: warn

  live-browser-smoke:
    needs: scope-check
    if: needs.scope-check.outputs.run_validation == 'true'
    name: Live Chrome / local test website
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract assistant source for integration test
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "Aurora_Control_Room_v2_4_0_FIRST_RUN_READY_AR.zip" -DestinationPath "ci_browser_source" -Force
          if (!(Test-Path "ci_browser_source/browser_control.py")) { throw "browser_control.py missing from source package" }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply reviewed fixes and skill-pack integration before testing the actual tool executor
        shell: pwsh
        run: |
          python .github/scripts/ci_prepare_release.py ci_browser_source
          python .github/scripts/ci_enrich_knowledge.py ci_browser_source
      - name: Install Selenium
        shell: pwsh
        run: python -m pip install --upgrade pip selenium
      - name: Exercise real Chrome against a disposable test website
        shell: pwsh
        run: |
          python .github/scripts/live_browser_smoke.py 2>&1 | Tee-Object -FilePath browser-smoke-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual LocalToolExecutor on the live public site
        shell: pwsh
        run: |
          python .github/scripts/live_tool_executor_smoke.py 2>&1 | Tee-Object -FilePath tool-executor-smoke-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload browser smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-smoke-report
          path: |
            browser-smoke-report.txt
            tool-executor-smoke-report.txt
          if-no-files-found: warn

  mt5-install-smoke:
    needs: scope-check
    if: needs.scope-check.outputs.run_validation == 'true'
    name: MetaTrader 5 install / assistant launch integration
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract assistant source for MT5 integration test
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "Aurora_Control_Room_v2_4_0_FIRST_RUN_READY_AR.zip" -DestinationPath "ci_mt5_source" -Force
          if (!(Test-Path "ci_mt5_source/windows_tools.py")) { throw "windows_tools.py missing from source package" }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Windows automation dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip pywinauto pyautogui pyperclip
      - name: Download, install, launch, and authenticate Headway demo MT5
        env:
          MT5_CREDENTIALS: ${{ secrets.mt5 }}
        shell: pwsh
        run: ./.github/scripts/mt5_install_smoke.ps1
      - name: Upload MetaTrader smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metatrader5-install-smoke-report
          path: ${{ runner.temp }}/aurora-mt5-smoke/logs/**
          if-no-files-found: warn
