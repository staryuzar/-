name: TV26 isolated strategy backtest (10-day follow-up)

on:
  push:
    branches:
      - tv26-five-timeframes-arabic-candidate
    paths:
      - ".github/scripts/tv26_strategy_backtest.ps1"
      - ".github/workflows/tv26-strategy-backtest.yml"
      - "trading-lab/tv26/TV26_FiveTF_Arabic_CANDIDATE.mq5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv26-strategy-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tester:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
      TV26_TEST_FROM: "2026.09.01"
      TV26_TEST_TO: "2026.09.11"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formula-audit dependencies
        run: python -m pip install -r trading-lab/tv26/requirements-formula-audit.txt
      - name: Run isolated 10-day Strategy Tester follow-up (not live)
        shell: pwsh
        run: ./.github/scripts/tv26_strategy_backtest.ps1
      - name: Validate strategy-run MT5 audit file
        shell: bash
        run: >-
          python trading-lab/tv26/validate_tv26_mt5_audit.py
          --csv tv26-strategy-results/TV26_Audit_XAUUSD_26102327.csv
          --report tv26-strategy-results/data-integrity-report.md
          --json tv26-strategy-results/data-integrity-report.json
      - name: Compare published formula votes across all five frames
        shell: bash
        run: >-
          python trading-lab/tv26/reference_tv26_formulas.py
          --audit tv26-strategy-results/TV26_Audit_XAUUSD_26102327.csv
          --history tv26-strategy-results/TV26_OHLC_History_XAUUSD.csv
          --report tv26-strategy-results/formula-parity-report.md
          --details tv26-strategy-results/formula-parity-details.csv
          --json tv26-strategy-results/formula-parity-report.json
      - name: Upload strategy backtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv26-strategy-backtest-${{ github.run_id }}
          path: tv26-strategy-results/
          if-no-files-found: warn
          retention-days: 30
