name: GoldLab Random Delay — SLTP Race Diagnostic v1.015

on:
  push:
    branches: [goldlab-sltp-race-diagnostic]
    paths:
      - "trading-lab/gold-xauusd/GoldLabEA.mq5"
      - ".github/scripts/goldlab_sltp_race_diagnostic.ps1"
      - ".github/scripts/goldlab_mt5_test.ps1"
      - ".github/workflows/goldlab-sltp-race-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldlab-shared-headway-mt5
  cancel-in-progress: true

jobs:
  sltp-race-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      MT5_CREDENTIALS: ${{ secrets.mt5 }}
    steps:
      - name: Checkout isolated v1.015 diagnostic branch
        uses: actions/checkout@v4

      - name: Parse PowerShell diagnostic before starting MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = ".github/scripts/goldlab_sltp_race_diagnostic.ps1"
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            foreach ($parseError in $parseErrors) {
              Write-Host ("PARSE FAIL line {0}: {1}" -f $parseError.Extent.StartLineNumber, $parseError.Message)
            }
            throw "SLTP race diagnostic has PowerShell parse errors; MT5 was not launched."
          }
          Write-Host ("PARSE PASS: {0} tokens; MT5 may launch." -f $tokens.Count)

      - name: Compile and run identical-input Random Delay test
        shell: pwsh
        run: .github/scripts/goldlab_sltp_race_diagnostic.ps1

      - name: Upload report, CSV, diagnostic log, and telemetry even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldlab-sltp-race-${{ github.run_id }}
          path: |
            goldlab-results/
            goldlab-ordercheck-preflight.txt
          if-no-files-found: warn
          retention-days: 90
